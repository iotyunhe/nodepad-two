<script>
/* ==== src/90-largefile.js ==== */
/* ============================================================================
 * 90-largefile.js — 大文件高效加载管线
 *
 * 大文件真正的瓶颈不在"读"，而在三件事：
 *   1) 一次性把整个文件 decode 成一个大字符串 → 峰值内存翻倍（UTF-16 每字符 2 字节）
 *   2) 用 String.split('\n') 拆行 → 再复制一遍，且产生一个超大中间数组
 *   3) 拆完立刻全量分词/全量渲染 → 主线程长时间阻塞，界面假死
 *
 * 本模块的对策：
 *   · 分片流式读取：按 CHUNK 切片，用 TextDecoder({stream:true}) 增量解码。
 *     这解决了「一个 UTF-8 多字节字符被切在两个分片之间」的经典问题
 *     （用 blob.text() 逐片解码必然乱码）。
 *   · 边读边拆行：只保留一个"跨片残行"carry，直接产出 lines 数组，
 *     绕开 split('\n') 的整串中间产物。
 *   · 主动让出主线程：每个分片后 await yieldToUI()，进度条才真的会动。
 *   · 直接构造 Document（跳过 setText 的二次拆分），并根据体量自动降级到轻量模式。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});

  const CHUNK = 4 * 1024 * 1024;          // 每片 4MB
  const HUGE = 32 * 1024 * 1024;          // 超过 32MB 提示用户
  const BOM_UTF8 = '\uFEFF';

  /**
   * 分片流式读取 Blob/File，边读边拆行。
   * @param {Blob} file
   * @param {(p:{ratio:number,loaded:number,total:number,lines:number})=>void} [onProgress]
   * @param {{aborted:boolean}} [signal]
   * @returns {Promise<{lines:string[], eol:string, bytes:number, ms:number}>}
   */
  async function readLines(file, onProgress, signal) {
    const t0 = (global.performance || Date).now();
    const total = file.size;
    const decoder = new TextDecoder('utf-8', { fatal: false });
    const lines = [];
    let carry = '';
    let offset = 0;
    let first = true;
    let crlf = 0, lf = 0;

    while (offset < total) {
      if (signal && signal.aborted) throw new Error('已取消');
      const end = Math.min(offset + CHUNK, total);
      const buf = await file.slice(offset, end).arrayBuffer();
      // stream:true 会把不完整的多字节序列留到下一次 decode，避免边界乱码
      let text = decoder.decode(new Uint8Array(buf), { stream: true });
      if (first) {
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);   // 去掉 BOM
        first = false;
      }
      const combined = carry + text;
      const parts = combined.split('\n');
      carry = parts.pop();                    // 最后一段可能被切断，留到下一片
      for (let i = 0; i < parts.length; i++) {
        let p = parts[i];
        if (p.charCodeAt(p.length - 1) === 13) { p = p.slice(0, -1); crlf++; } else lf++;
        lines.push(p);
      }
      offset = end;
      if (onProgress) onProgress({ ratio: offset / total, loaded: offset, total, lines: lines.length });
      await NT.yieldToUI();                   // 让出主线程，进度条才会刷新
    }
    carry += decoder.decode();                // 冲刷解码器内部残留
    if (carry.length) {
      if (carry.charCodeAt(carry.length - 1) === 13) carry = carry.slice(0, -1);
      lines.push(carry);
    }
    if (!lines.length) lines.push('');
    return {
      lines, eol: crlf > lf ? '\r\n' : '\n', bytes: total,
      ms: (global.performance || Date).now() - t0
    };
  }

  /**
   * 直接用行数组构造 Document —— 跳过 setText 的整串 split，省一次全量拷贝。
   * 这是 20 万行以上文件能"秒开"的关键一步。
   */
  function docFromLines(lines, opts) {
    const doc = new NT.Document('', opts);
    doc.lines = lines;
    let len = lines.length - 1;               // 换行符个数
    for (let i = 0; i < lines.length; i++) len += lines[i].length;
    doc._len = len;
    doc._dirtyFrom = 0;
    doc._ensureIndex();
    doc.version++;
    // 注意：这里刻意不调用 doc.stats()。词数统计需要逐行跑正则，
    // 对 100 万行是数百毫秒的纯浪费；统计本身是惰性缓存的，
    // 等用户真的打开「统计」面板时再算。
    return doc;
  }

  /**
   * 统一入口：把 File 变成可编辑的 Document。
   * @param {object} app 应用实例（用于进度提示与 toast）
   * @param {File} file
   * @param {object} [opt] {signal}
   */
  async function openFile(app, file, opt) {
    opt = opt || {};
    const sizeText = NT.util.formatBytes(file.size);
    const huge = file.size > HUGE;

    app.showLoading(
      '正在打开 ' + file.name,
      huge ? '文件较大（' + sizeText + '），将分片流式读取并自动进入轻量模式' : '读取中…'
    );
    try {
      const res = await readLines(file, (p) => {
        app.updateLoading(p.ratio, NT.util.formatBytes(p.loaded) + ' / ' + sizeText +
          ' · 已解析 ' + p.lines.toLocaleString() + ' 行');
      }, opt.signal);
      app.hideLoading();

      const lang = NT.util.langFromPath(file.name);
      const doc = docFromLines(res.lines, { name: file.name, path: file.name, language: lang });
      doc.eol = res.eol;
      doc.markClean();
      return { doc, meta: res, sizeText };
    } catch (e) {
      app.hideLoading();
      throw e;
    }
  }

  /** 把已经在内存里的文本走同一条管线（用于粘贴超大内容、生成测试文件） */
  async function openText(app, text, name, opt) {
    opt = opt || {};
    const lines = [];
    let i = 0;
    const n = text.length;
    while (i < n) {
      const j = text.indexOf('\n', i);
      if (j < 0) { lines.push(text.slice(i)); break; }
      lines.push(text.slice(i, j));
      i = j + 1;
      if ((lines.length & 0xFFFF) === 0) {
        if (opt.onProgress) opt.onProgress(lines.length / (n / 40));
        await NT.yieldToUI();
      }
    }
    if (!lines.length) lines.push('');
    const doc = docFromLines(lines, { name, path: name, language: NT.util.langFromPath(name) });
    doc.markClean();
    return doc;
  }

  /**
   * 生成合成测试文件（内存 Blob），用于端到端验证加载管线。
   * 走的是与真实文件完全相同的分片读取路径。
   */
  function generateTestFile(lineCount, kind) {
    kind = kind || 'js';
    const cap = 2000000;
    const count = Math.max(1000, Math.min(lineCount | 0, cap));
    const parts = new Array(count);
    if (kind === 'log') {
      for (let i = 0; i < count; i++) {
        const ts = new Date(Date.UTC(2026, 0, 1) + i * 1000).toISOString();
        parts[i] = ts + ' [INFO] worker-' + (i % 16) + ' processed batch ' + i +
          ' in ' + (i % 250) + 'ms status=ok payload=' + JSON.stringify({ id: i, ok: true });
      }
    } else if (kind === 'csv') {
      parts[0] = 'id,name,email,score,created_at';
      for (let i = 1; i < count; i++) {
        parts[i] = i + ',user_' + i + ',user' + i + '@example.com,' +
          ((i * 7919) % 100) + ',2026-01-' + String((i % 28) + 1).padStart(2, '0');
      }
    } else if (kind === 'plain') {
      for (let i = 0; i < count; i++) {
        parts[i] = '这是第 ' + (i + 1) + ' 行测试文本，用于验证大文件加载与虚拟化渲染。' +
          'The quick brown fox jumps over the lazy dog.';
      }
    } else {
      for (let i = 0; i < count; i++) {
        const m = i % 5;
        if (m === 0) parts[i] = 'function fn' + i + '(a, b) { // TODO: 优化 ' + i;
        else if (m === 1) parts[i] = '  const value' + i + ' = "str_' + i + '" + ' + i + ';';
        else if (m === 2) parts[i] = '  if (a > ' + i + ') { return { id: ' + i + ', ok: true }; }';
        else if (m === 3) parts[i] = '  /* 块注释 ' + i + ' */ return a + b * ' + i + ';';
        else parts[i] = '}';
      }
    }
    const text = parts.join('\n');
    const ext = kind === 'log' ? 'log' : kind === 'csv' ? 'csv' : kind === 'plain' ? 'txt' : 'js';
    return new File([text], 'synthetic-' + count + '-lines.' + ext, { type: 'text/plain' });
  }

  /**
   * 性能档位建议：根据体量给出应当启用的特性组合。
   */
  function tierOf(bytes, lines) {
    if (bytes > 4 * 1024 * 1024 || lines > 120000) {
      return { id: 'light', name: '轻量模式', highlight: false, fold: false, wordComplete: false };
    }
    if (bytes > 512 * 1024 || lines > 20000) {
      return { id: 'lean', name: '精简模式', highlight: true, fold: true, wordComplete: false };
    }
    return { id: 'full', name: '完整模式', highlight: true, fold: true, wordComplete: true };
  }

  NT.largefile = { readLines, docFromLines, openFile, openText, generateTestFile, tierOf, CHUNK, HUGE };

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== src/95-app.js ==== */
/* ============================================================================
 * 95-app.js — 应用层（Shell）
 *
 * 职责：把所有模块装配成一个可用产品。包含
 *   命令系统（注册表 + 快捷键派发 + 宏录制钩子 + 命令面板数据源）
 *   标签页管理、菜单栏 / 工具栏 / 状态栏 / 侧边栏 / 查找栏 / 命令面板 / 模态框
 *   全部内置命令（文件、编辑、搜索、视图、语言、宏、插件、帮助）
 *
 * 一条贯穿全局的硬约定：**任何会修改文档或光标的操作都必须走 app.exec()**。
 * 宏录制、命令面板、快捷键、插件 API 全部依赖这个单一入口，否则行为会分叉。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});
  const U = NT.util;

  const LS_KEY = 'nt2.settings.v1';

  /* =========================================================== 命令注册表 */
  class Commands {
    constructor(app) {
      this.app = app;
      this.map = new Map();
      this.keys = new Map();     // 'ctrl+shift+p' -> [cmdId...]
    }
    register(spec) {
      this.map.set(spec.id, spec);
      this._rebuild();
      return spec.id;
    }
    unregister(id) { this.map.delete(id); this._rebuild(); }
    get(id) { return this.map.get(id); }
    list() { return Array.from(this.map.values()); }
    _rebuild() {
      this.keys.clear();
      for (const cmd of this.map.values()) {
        const kb = cmd.keybinding;
        if (!kb) continue;
        for (const one of (Array.isArray(kb) ? kb : [kb])) {
          const k = Commands.normalizeBinding(one);
          if (!k) continue;
          if (!this.keys.has(k)) this.keys.set(k, []);
          this.keys.get(k).push(cmd.id);
        }
      }
    }
    static normalizeBinding(str) {
      if (!str) return null;
      const parts = String(str).toLowerCase().split('+').map((s) => s.trim()).filter(Boolean);
      const mods = new Set();
      let key = '';
      for (const p of parts) {
        if (p === 'ctrl' || p === 'control' || p === 'cmd' || p === 'meta') mods.add('ctrl');
        else if (p === 'shift') mods.add('shift');
        else if (p === 'alt' || p === 'option') mods.add('alt');
        else key = p;
      }
      if (!key) return null;
      const order = ['ctrl', 'alt', 'shift'];
      return order.filter((m) => mods.has(m)).concat([key]).join('+');
    }
    static eventToBinding(e) {
      const mods = [];
      if (e.ctrlKey || e.metaKey) mods.push('ctrl');
      if (e.altKey) mods.push('alt');
      if (e.shiftKey) mods.push('shift');
      let k = e.key;
      if (!k) return null;
      if (k === ' ') k = 'space';
      else if (k === 'Escape') k = 'escape';
      else if (k === 'Delete') k = 'delete';
      else if (k === 'Backspace') k = 'backspace';
      else if (k === 'Enter') k = 'enter';
      else if (k === 'Tab') k = 'tab';
      else if (k.length > 1) k = k.toLowerCase();
      else k = k.toLowerCase();
      return mods.concat([k]).join('+');
    }
  }

  /* ================================================================== App */
  class App {
    constructor() {
      this.settings = this._loadSettings();
      this.commands = new Commands(this);
      this.textProcessors = [];
      this.tabs = [];
      this.activeTab = null;
      this._tabSeq = 0;
      this._menuItems = [];       // 插件注入的菜单项
      this._statusItems = [];     // 插件注入的状态栏条目
      this._toolbarButtons = [];
      this._sidePanels = [];      // 插件注入的侧栏面板
      this._sideTab = 'plugins';
      this.searchState = {
        query: '', replacement: '', regex: false, caseSensitive: false,
        wholeWord: false, inSelection: false, matches: [], index: -1
      };
      this._saveHandles = new Map();   // tabId -> FileSystemFileHandle

      // 插件宿主通过 app.ui.* 访问界面扩展点。这里显式收拢成一个门面对象，
      // 好处是插件 API 的边界一目了然，也便于将来把 UI 层替换掉。
      this.ui = {
        addMenuItem: (spec) => this.addMenuItem(spec),
        removeMenuItem: (menu, label) => this.removeMenuItem(menu, label),
        addToolbarButton: (spec) => this.addToolbarButton(spec),
        removeToolbarButton: (id) => this.removeToolbarButton(id),
        addStatusItem: (spec) => this.addStatusItem(spec),
        removeStatusItem: (id) => this.removeStatusItem(id),
        addSidePanel: (spec) => this.addSidePanel(spec),
        removeSidePanel: (id) => this.removeSidePanel(id)
      };
    }

    /* --------------------------------------------- 插件可注入的界面扩展点 */
    addMenuItem(spec) {
      if (!spec || !spec.menu || !spec.label) return;
      this._menuItems.push(spec);
    }
    removeMenuItem(menu, label) {
      this._menuItems = this._menuItems.filter((m) => !(m.menu === menu && m.label === label));
    }

    /* ------------------------------------------------------------ 启动 */
    boot() {
      this._buildUi();
      this.view = new NT.EditorView(document.getElementById('editorHost'), this);
      this.view.ac = new NT.CompletionController(this.view);
      this.plugins = new NT.PluginHost(this);
      this.macros = new NT.MacroEngine(this);

      this._registerCoreCommands();
      this._bindGlobalEvents();

      for (const p of (NT.builtinPlugins || [])) this.plugins.register(p);
      this.plugins.activateDefaults();

      this._applySettings();
      this.renderToolbar();
      this.renderStatusbar();

      this.newTab(new NT.Document(this._welcomeText(), { name: '欢迎.md', language: 'markdown' }), { activate: true });
      this.view.doc.markClean();
      this.renderTabs();
      this.refreshAll();

      this.toast('Notepad Two 已就绪 · 按 Ctrl+Shift+P 打开命令面板，F1 查看快捷键', 'ok');
    }

    _welcomeText() {
      return [
        '# Notepad Two',
        '',
        '一个用原生 Web 技术实现的、对标 Notepad++ 的文本编辑器。**零运行时依赖。**',
        '',
        '## 快速上手',
        '',
        '| 操作 | 快捷键 |',
        '| --- | --- |',
        '| 命令面板 | `Ctrl+Shift+P` |',
        '| 查找 / 替换 | `Ctrl+F` / `Ctrl+H` |',
        '| 转到行 | `Ctrl+G` |',
        '| 自动补全 | `Ctrl+Space` |',
        '| 折叠 / 展开全部 | `Alt+0` / `Alt+Shift+0` |',
        '| 开始 / 停止录制宏 | `Ctrl+Shift+R` |',
        '| 回放宏 | `Ctrl+Alt+P` |',
        '| 快捷键总览 | `F1` |',
        '',
        '## 试一试这些功能',
        '',
        '1. **多标签页**：点标签栏右侧的 `+` 新建，双击标签名可重命名。',
        '2. **语法高亮**：右下角切换语言，或用工具栏的语言下拉框。',
        '3. **代码折叠**：点行号左侧的三角，或把鼠标移到行号上。',
        '4. **自动补全**：在下面输入 `fun` 或 `cons` 看看。',
        '5. **正则查找**：`Ctrl+H` → 打开 `.*` 开关 → 搜索 `\\b(\\w+)@(\\w+)\\.com\\b`，',
        '   替换为 `$2://$1`，再点「全部替换」。',
        '6. **宏**：`Ctrl+Shift+R` 开始录制，随便打几个字，再停止；然后 `Ctrl+Alt+P` 回放。',
        '7. **插件**：右侧「插件」面板里可以开关内置插件，也能直接粘贴一段插件源码热加载。',
        '8. **大文件**：菜单 `文件 → 生成测试大文件`，选 20 万行或 100 万行，',
        '   观察分片流式加载进度与虚拟化渲染的滚动流畅度。',
        '',
        '## 一段可以试试折叠的代码',
        '',
        '```javascript',
        'function quickSort(arr, lo = 0, hi = arr.length - 1) {',
        '  if (lo >= hi) return arr;',
        '  const pivot = arr[(lo + hi) >> 1];',
        '  let i = lo, j = hi;',
        '  while (i <= j) {',
        '    while (arr[i] < pivot) i++;',
        '    while (arr[j] > pivot) j--;',
        '    if (i <= j) {',
        '      [arr[i], arr[j]] = [arr[j], arr[i]];',
        '      i++; j--;',
        '    }',
        '  }',
        '  quickSort(arr, lo, j);',
        '  quickSort(arr, i, hi);',
        '  return arr;',
        '}',
        '```',
        '',
        '> 提示：把光标放到任意括号旁边，配对的括号会被高亮（内置插件 `括号配对高亮`）。',
        ''
      ].join('\n');

        fontSize: 13, theme: 'light', macroDelay: 30, autoComplete: true,
        lightweightLines: 120000, lightweightBytes: 4 * 1024 * 1024,
        showSidebar: true
      };
      try {
        const raw = localStorage.getItem(LS_KEY);
        return raw ? Object.assign(def, JSON.parse(raw)) : def;

    _buildMenus() {
      const bar = this.el.menubar;
      bar.innerHTML = '<span class="brand">Notepad Two</span>';
      for (const m of this.menus) {
        const el = document.createElement('div');
        el.className = 'menu-root';
        el.textContent = m.label;
        el.dataset.menu = m.id;
        bar.appendChild(el);
      }
      bar.addEventListener('click', (e) => {
        const root = e.target.closest('.menu-root');
        if (!root) return;
        this._openMenu(root);
      });
      document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.menu-pop') && !e.target.closest('.menu-root')) this._closeMenu();
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') this._closeMenu(); }, true);
    }

    _openMenu(root) {
      const already = this._openMenuEl && this._openMenuEl.dataset.for === root.dataset.menu;
      this._closeMenu();
      if (already) return;
      const menuId = root.dataset.menu;
      const items = this._menuItemsFor(menuId);
      if (!items || !items.length) return;

      const pop = document.createElement('div');
      pop.className = 'menu-pop';
      pop.dataset.for = menuId;
      for (const it of items) {
        if (it.sep) { pop.insertAdjacentHTML('beforeend', '<div class="menu-sep"></div>'); continue; }
        const cmd = it.command ? this.commands.get(it.command) : null;
        const disabled = cmd && cmd.enabled && !cmd.enabled(this);
        const checked = it.checked ? it.checked() : false;
        const div = document.createElement('div');
        div.className = 'menu-item' + (disabled ? ' disabled' : '');
        const keyText = cmd && cmd.keybinding
          ? (Array.isArray(cmd.keybinding) ? cmd.keybinding[0] : cmd.keybinding).replace(/Ctrl/g, 'Ctrl').replace(/\+/g, '+')
          : '';
        div.innerHTML =
          '<span class="mi-check">' + (checked ? '✓' : '') + '</span>' +
          '<span class="mi-label">' + U.esc(it.label) + '</span>' +
          '<span class="menu-key">' + U.esc(keyText) + '</span>';
        div.addEventListener('click', () => {
          this._closeMenu();
          if (disabled) return;
          if (it.command) this.exec(it.command, it.args);
          else if (it.run) it.run();
        });
        pop.appendChild(div);
      }
      document.body.appendChild(pop);
      const r = root.getBoundingClientRect();
      pop.style.left = r.left + 'px';
      pop.style.top = (r.bottom + 2) + 'px';
      const pr = pop.getBoundingClientRect();
      if (pr.right > innerWidth - 8) pop.style.left = Math.max(4, innerWidth - pr.width - 8) + 'px';
      if (pr.bottom > innerHeight - 8) pop.style.top = Math.max(4, r.top - pr.height - 2) + 'px';
      root.classList.add('open');
      this._openMenuEl = pop;
      this._openMenuRoot = root;
    }
    _closeMenu() {
      if (this._openMenuEl) this._openMenuEl.remove();
      if (this._openMenuRoot) this._openMenuRoot.classList.remove('open');
      this._openMenuEl = null;
      this._openMenuRoot = null;
    }

    _menuItemsFor(menuId) {
      if (menuId === 'lang') {
        return NT.languages.list().map((l) => ({
          label: l.name + (l.ext.length ? '  (' + l.ext.slice(0, 3).join('/') + ')' : ''),
          checked: () => this.activeDoc && this.activeDoc.language === l.id,
          run: () => this.exec('lang.set', { id: l.id })
        }));
      }
      if (menuId === 'tools') {
        if (!this.textProcessors.length) return [{ label: '（暂无处理器，启用「文本处理工具」插件）', run: () => {} }];
        const byPlugin = new Map();
        for (const t of this.textProcessors) {
          if (!byPlugin.has(t.plugin)) byPlugin.set(t.plugin, []);
          byPlugin.get(t.plugin).push(t);
        }
        const out = [];
        for (const [pid, list] of byPlugin) {
          if (out.length) out.push({ sep: true });
          for (const t of list) out.push({ label: t.title, run: () => this.exec('text.process', { id: t.id }) });
        }
        return out;
      }
      const base = (this._menuDefs()[menuId] || []).slice();
      const injected = this._menuItems.filter((m) => m.menu === menuId);
      if (injected.length) {
        base.push({ sep: true });
        for (const m of injected.sort((a, b) => (a.order || 50) - (b.order || 50))) base.push(m);
      }
      return base;
    }
