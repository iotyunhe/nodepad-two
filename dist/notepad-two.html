<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notepad Two — 高性能文本编辑器</title>
<style>
/* ==== src/styles.css ==== */
/* ============================================================================
 * Notepad Two — 样式层
 * 设计要点：
 *  1) 全部通过 CSS 变量驱动，明/暗主题只切换 [data-theme] 上的变量表；
 *  2) 编辑器采用「textarea + 高亮层叠加」结构，因此字体度量必须完全一致，
 *     所有影响排版的属性集中在 --nt-font-* / --nt-line-height 上，禁止局部覆盖；
 *  3) 高亮层与行号槽均做「可见行虚拟化」，由 JS 设置 transform 平移。
 * ========================================================================== */

:root {
  --nt-font: "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", Menlo,
             "DejaVu Sans Mono", "Courier New", monospace;
  --nt-font-ui: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --nt-font-size: 13px;
  --nt-line-height: 20px;
  --nt-pad-top: 8px;
  --nt-pad-left: 14px;
  --nt-tab-size: 4;

  --bg: #ffffff;
  --bg-alt: #f2f3f5;
  --bg-panel: #fafbfc;
  --bg-elev: #ffffff;
  --border: #e1e4e8;
  --border-strong: #cfd4da;
  --fg: #1f2328;
  --fg-dim: #6b7280;
  --fg-faint: #9aa3af;
  --accent: #2f6feb;
  --accent-soft: #dde8ff;
  --accent-fg: #ffffff;
  --danger: #d1242f;
  --ok: #1a7f37;
  --warn: #b76b01;

  --gutter-bg: #f7f8fa;
  --gutter-fg: #a7b0bb;
  --gutter-fg-active: #1f2328;
  --current-line: #f5f8ff;
  --selection: rgba(47, 111, 235, .22);
  --fold-bg: #e8edf5;
  --fold-fg: #5b6472;
  --match-bg: #ffe9a8;
  --match-active-bg: #ffb454;
  --shadow: 0 10px 34px rgba(16, 24, 40, .14);
  --shadow-sm: 0 2px 8px rgba(16, 24, 40, .10);

  /* 语法着色（浅色主题：保证 WCAG AA 对比度） */
  --t-comment: #8a919c;
  --t-keyword: #a626a4;
  --t-string: #0a7d33;
  --t-number: #b76b01;
  --t-func: #2f6feb;
  --t-type: #0b7285;
  --t-op: #5a6472;
  --t-punct: #6b7280;
  --t-var: #1f2328;
  --t-tag: #c0392b;
  --t-attr: #9a6700;
  --t-builtin: #6f42c1;
  --t-regex: #0a7d33;
  --t-heading: #1a4fa0;
  --t-link: #2f6feb;
  --t-invalid: #d1242f;
}

html[data-theme="dark"] {
  --bg: #1e2127;
  --bg-alt: #262b33;
  --bg-panel: #22262d;
  --bg-elev: #2b3038;
  --border: #363c45;
  --border-strong: #4a525d;
  --fg: #d7dce3;
  --fg-dim: #98a2b0;
  --fg-faint: #6f7885;
  --accent: #4d8dff;
  --accent-soft: #2b3b57;
  --accent-fg: #ffffff;
  --danger: #f2686f;
  --ok: #4ec27a;
  --warn: #e0a458;

  --gutter-bg: #22262d;
  --gutter-fg: #5c6673;
  --gutter-fg-active: #d7dce3;
  --current-line: #262c35;
  --selection: rgba(77, 141, 255, .28);
  --fold-bg: #333a45;
  --fold-fg: #9aa5b4;
  --match-bg: #5a4a17;
  --match-active-bg: #8a6d1a;
  --shadow: 0 12px 40px rgba(0, 0, 0, .55);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, .4);

  --t-comment: #7f8899;
  --t-keyword: #c678dd;
  --t-string: #98c379;
  --t-number: #d19a66;
  --t-func: #61afef;
  --t-type: #56b6c2;
  --t-op: #9aa5b4;
  --t-punct: #8b95a3;
  --t-var: #d7dce3;
  --t-tag: #e06c75;
  --t-attr: #d19a66;
  --t-builtin: #c678dd;
  --t-regex: #98c379;
  --t-heading: #61afef;
  --t-link: #61afef;
  --t-invalid: #e06c75;
}

* { box-sizing: border-box; }
/* 关键：本文件里 .findbar/.palette-wrap/.overlay 都设了 display:flex|grid，
   作者样式的优先级高于 UA 对 [hidden] 的 display:none，会让 hidden 属性完全失效。
   必须显式兜底，否则这些浮层会一直显示。 */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--nt-font-ui);
  font-size: 13px;
  color: var(--fg);
  background: var(--bg);
  overflow: hidden;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 6px;
  border: 3px solid transparent; background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--fg-faint); background-clip: content-box; }
::-webkit-scrollbar-corner { background: transparent; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---------------------------------------------------------------- 菜单栏 */
.menubar {
  display: flex; align-items: center; gap: 1px;
  height: 30px; padding: 0 6px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  user-select: none; flex: none;
  position: relative; z-index: 60;
}
.menubar .brand {
  font-weight: 600; letter-spacing: .3px; color: var(--accent);
  margin: 0 12px 0 4px; white-space: nowrap;
}
.menu-root {
  padding: 4px 10px; border-radius: 5px; cursor: default; white-space: nowrap;
}
.menu-root:hover, .menu-root.open { background: var(--accent-soft); color: var(--accent); }
.menu-pop {
  position: fixed; min-width: 230px; padding: 5px;
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow);
  z-index: 200; user-select: none;
}
.menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 9px; border-radius: 5px; cursor: default; white-space: nowrap;
}
.menu-item:hover { background: var(--accent); color: var(--accent-fg); }
.menu-item:hover .menu-key { color: rgba(255,255,255,.75); }
.menu-item.disabled { opacity: .42; pointer-events: none; }
.menu-item .mi-label { flex: 1; }
.menu-item .menu-key { color: var(--fg-faint); font-size: 11px; }
.menu-item .mi-check { width: 14px; color: var(--accent); }
.menu-item:hover .mi-check { color: var(--accent-fg); }
.menu-sep { height: 1px; background: var(--border); margin: 5px 8px; }

/* ---------------------------------------------------------------- 工具栏 */
.toolbar {
  display: flex; align-items: center; gap: 4px;
  height: 36px; padding: 0 8px; flex: none;
  background: var(--bg-alt); border-bottom: 1px solid var(--border);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.tbtn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 9px; border-radius: 6px;
  background: transparent; border: 1px solid transparent;
  cursor: pointer; white-space: nowrap; color: var(--fg);
}
.tbtn:hover { background: var(--bg-elev); border-color: var(--border); }
.tbtn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.tbtn.rec { background: var(--danger); color: #fff; border-color: var(--danger); animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.tsep { width: 1px; height: 20px; background: var(--border-strong); margin: 0 5px; flex: none; }
.tselect {
  height: 26px; padding: 0 6px; border-radius: 6px;
  background: var(--bg-elev); border: 1px solid var(--border); cursor: pointer;
}

/* ---------------------------------------------------------------- 标签页 */
.tabstrip {
  display: flex; align-items: stretch; height: 34px; flex: none;
  background: var(--bg-alt); border-bottom: 1px solid var(--border);
}
.tabbar { display: flex; align-items: stretch; overflow-x: auto; flex: 1; scrollbar-width: none; }
.tabbar::-webkit-scrollbar { display: none; }
.tabstrip-actions { display: flex; align-items: center; padding: 0 8px; gap: 2px; }
.tab {
  display: flex; align-items: center; gap: 7px;
  padding: 0 8px 0 12px; min-width: 118px; max-width: 230px;
  border-right: 1px solid var(--border);
  background: var(--bg-alt); color: var(--fg-dim);
  cursor: default; user-select: none; white-space: nowrap; position: relative;
}
.tab:hover { background: var(--bg); }
.tab.active { background: var(--bg); color: var(--fg); font-weight: 500; }
.tab.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--accent);
}
.tab.drag-over { box-shadow: inset 3px 0 0 var(--accent); }
.tab .tab-name { overflow: hidden; text-overflow: ellipsis; }
.tab .tab-dot { color: var(--accent); font-size: 17px; line-height: 1; }
.tab .tab-close {
  width: 17px; height: 17px; border: 0; border-radius: 4px; background: transparent;
  color: var(--fg-faint); cursor: pointer; font-size: 13px; line-height: 1;
  display: grid; place-items: center; padding: 0; flex: none;
}
.tab .tab-close:hover { background: var(--border-strong); color: var(--fg); }
.tab-add {
  width: 28px; height: 28px; margin: 3px 4px; border: 0; border-radius: 6px;
  background: transparent; color: var(--fg-dim); cursor: pointer; font-size: 16px;
}
.tab-add:hover { background: var(--bg-elev); color: var(--accent); }

/* ------------------------------------------------------------ 主体布局 */
.main { display: flex; flex: 1; min-height: 0; }
.editor-host { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }

/* --------------------------------------------------------- 编辑器内核 */
.nt-editor {
  position: relative; flex: 1; display: flex; min-height: 0;
  background: var(--bg); overflow: hidden;
}
.nt-gutter {
  position: relative; flex: none; overflow: hidden;
  background: var(--gutter-bg); border-right: 1px solid var(--border);
  font-family: var(--nt-font); font-size: var(--nt-font-size);
  line-height: var(--nt-line-height); user-select: none;
  min-width: 54px;
}
.nt-gutter-inner { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }
.nt-ln {
  display: flex; align-items: center; justify-content: flex-end;
  height: var(--nt-line-height); padding: 0 6px 0 8px;
  color: var(--gutter-fg); white-space: nowrap;
}
.nt-ln .ln-num { flex: 1; text-align: right; }
.nt-ln.active { color: var(--gutter-fg-active); font-weight: 600; }
.nt-ln .ln-fold {
  width: 13px; height: 13px; flex: none; margin-right: 2px;
  display: grid; place-items: center; border-radius: 3px;
  color: var(--fold-fg); font-size: 9px; cursor: pointer; opacity: 0;
}
.nt-ln:hover .ln-fold.has { opacity: 1; }
.nt-ln .ln-fold.has { opacity: .55; }
.nt-ln .ln-fold:hover { background: var(--fold-bg); opacity: 1; }
.nt-ln.folded .ln-fold { opacity: 1; background: var(--fold-bg); }

.nt-scroll { position: relative; flex: 1; overflow: hidden; min-width: 0; }
.nt-hl, .nt-input {
  font-family: var(--nt-font) !important;
  font-size: var(--nt-font-size) !important;
  line-height: var(--nt-line-height) !important;
  letter-spacing: 0 !important;
  tab-size: var(--nt-tab-size);
  -moz-tab-size: var(--nt-tab-size);
  white-space: pre; word-wrap: normal; overflow-wrap: normal;
  margin: 0; border: 0;
  padding: var(--nt-pad-top) var(--nt-pad-left);
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0;
}
.nt-hl {
  position: absolute; top: 0; left: 0; pointer-events: none;
  min-width: 100%; width: max-content;
  color: var(--fg); z-index: 1;
}
.nt-hl code { display: block; font: inherit; will-change: transform; }
.nt-hl .row { display: block; height: var(--nt-line-height); }
.nt-input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  resize: none; outline: none; z-index: 2;
  background: transparent; border: 0;
  color: transparent;
  -webkit-text-fill-color: transparent;
  caret-color: var(--fg);
  overflow: auto;
}
.nt-input::selection { background: var(--selection); -webkit-text-fill-color: transparent; }
.nt-input::placeholder { color: var(--fg-faint); -webkit-text-fill-color: var(--fg-faint); }

.nt-curline {
  position: absolute; left: 0; right: 0; height: var(--nt-line-height);
  background: var(--current-line); z-index: 0; pointer-events: none;
  will-change: transform;
}
.nt-fold-ph {
  display: inline-block; padding: 0 8px; border-radius: 4px;
  background: var(--fold-bg); color: var(--fold-fg);
  font-size: 11px; line-height: 15px; vertical-align: 1px;
  user-select: none;
}

/* 语法着色 */
.tk-comment { color: var(--t-comment); font-style: italic; }
.tk-keyword { color: var(--t-keyword); }
.tk-string  { color: var(--t-string); }
.tk-number  { color: var(--t-number); }
.tk-func    { color: var(--t-func); }
.tk-type    { color: var(--t-type); }
.tk-op      { color: var(--t-op); }
.tk-punct   { color: var(--t-punct); }
.tk-var     { color: var(--t-var); }
.tk-tag     { color: var(--t-tag); }
.tk-attr    { color: var(--t-attr); }
.tk-builtin { color: var(--t-builtin); }
.tk-regex   { color: var(--t-regex); }
.tk-heading { color: var(--t-heading); font-weight: 600; }
.tk-link    { color: var(--t-link); text-decoration: underline; }
.tk-invalid { color: var(--t-invalid); text-decoration: wavy underline; }
.tk-bold    { font-weight: 700; }
.tk-italic  { font-style: italic; }

/* 搜索/装饰高亮（由装饰器层叠加） */
.dec-match { background: var(--match-bg); border-radius: 2px; }
.dec-match-active { background: var(--match-active-bg); border-radius: 2px; }
.dec-bracket { background: var(--accent-soft); outline: 1px solid var(--accent); border-radius: 2px; }
.dec-todo { background: rgba(255,180,84,.35); border-radius: 2px; }

/* ------------------------------------------------------------ 侧边栏 */
.sidebar {
  width: 320px; flex: none; display: flex; flex-direction: column;
  background: var(--bg-panel); border-left: 1px solid var(--border);
}
.sidebar.hidden { display: none; }
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); flex: none; }
.sidebar-tabs button {
  flex: 1; padding: 8px 4px; border: 0; background: transparent;
  color: var(--fg-dim); cursor: pointer; border-bottom: 2px solid transparent;
}
.sidebar-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.sidebar-body { flex: 1; overflow: auto; padding: 10px 12px; font-size: 12.5px; }
.sidebar-body h4 { margin: 0 0 8px; font-size: 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .5px; }
.sidebar-body .row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
.sidebar-body .row b { font-weight: 600; }
.plugin-card {
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px;
  margin-bottom: 8px; background: var(--bg-elev);
}
.plugin-card .pc-head { display: flex; align-items: center; gap: 8px; }
.plugin-card .pc-name { font-weight: 600; flex: 1; }
.plugin-card .pc-desc { color: var(--fg-dim); margin: 5px 0 7px; line-height: 1.5; }
.switch { position: relative; width: 34px; height: 18px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch i {
  position: absolute; inset: 0; border-radius: 10px; background: var(--border-strong);
  transition: .16s; pointer-events: none;
}
.switch i::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: 50%; background: #fff; transition: .16s;
}
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }
.mini-btn {
  padding: 4px 9px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-elev); cursor: pointer;
}
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }
.sidebar textarea {
  width: 100%; height: 130px; resize: vertical; padding: 7px;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
  font-family: var(--nt-font); font-size: 12px; color: var(--fg);
}

/* ------------------------------------------------------------ 状态栏 */
.statusbar {
  display: flex; align-items: center; gap: 0; height: 24px; flex: none;
  background: var(--accent); color: #fff; font-size: 11.5px;
  padding: 0 4px; user-select: none; overflow: hidden;
}
.statusbar .sb {
  padding: 0 9px; white-space: nowrap; cursor: default; border-radius: 4px;
  height: 20px; display: flex; align-items: center;
}
.statusbar .sb.clickable:hover { background: rgba(255,255,255,.22); }
.statusbar .sb-right { margin-left: auto; }
.statusbar .sb-plugins { background: rgba(255,255,255,.16); }

/* ------------------------------------------------------------ 查找栏 */
.findbar {
  position: fixed; top: 106px; right: 24px; z-index: 40;
  display: flex; flex-direction: column; gap: 6px;
  padding: 9px 10px; border-radius: 9px;
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow); min-width: 480px;
}
.findbar .fr { display: flex; align-items: center; gap: 6px; }
.findbar input[type=text] {
  flex: 1; height: 27px; padding: 0 8px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  font-family: var(--nt-font); font-size: 12.5px;
}
.findbar input[type=text]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.findbar input.bad { border-color: var(--danger); }
.fopt {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 27px; height: 27px; padding: 0 6px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-elev);
  cursor: pointer; color: var(--fg-dim); font-size: 12px;
}
.fopt:hover { border-color: var(--accent); color: var(--accent); }
.fopt.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.findbar .fcount { color: var(--fg-dim); font-size: 11.5px; min-width: 74px; text-align: center; }

/* -------------------------------------------------------- 命令面板 */
.palette-wrap {
  position: fixed; inset: 0; z-index: 300; background: rgba(16,24,40,.34);
  display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh;
}
.palette {
  width: min(640px, 92vw); max-height: 62vh; overflow: hidden;
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  border-radius: 11px; box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.palette input {
  width: 100%; height: 46px; padding: 0 16px; border: 0; outline: 0;
  background: transparent; color: var(--fg); font-size: 14.5px;
  border-bottom: 1px solid var(--border);
}
.palette .plist { overflow: auto; padding: 6px; }
.pitem {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 11px; border-radius: 7px; cursor: default;
}
.pitem .pi-title { flex: 1; }
.pitem .pi-src { color: var(--fg-faint); font-size: 11px; }
.pitem.sel { background: var(--accent); color: var(--accent-fg); }
.pitem.sel .pi-src { color: rgba(255,255,255,.72); }
.pempty { padding: 18px; text-align: center; color: var(--fg-dim); }

/* ------------------------------------------------------------ 补全弹窗 */
.nt-ac {
  position: absolute; z-index: 50; min-width: 220px; max-height: 216px; overflow: auto;
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  border-radius: 8px; box-shadow: var(--shadow); padding: 4px;
  font-family: var(--nt-font-ui); font-size: 12.5px;
}
.nt-ac-item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 5px; cursor: default; }
.nt-ac-item .ac-kind {
  font-size: 10px; padding: 1px 5px; border-radius: 4px;
  background: var(--accent-soft); color: var(--accent); flex: none;
}
.nt-ac-item .ac-label { flex: 1; font-family: var(--nt-font); }
.nt-ac-item .ac-detail { color: var(--fg-faint); font-size: 11px; }
.nt-ac-item.sel { background: var(--accent); color: var(--accent-fg); }
.nt-ac-item.sel .ac-kind { background: rgba(255,255,255,.25); color: #fff; }
.nt-ac-item.sel .ac-detail { color: rgba(255,255,255,.75); }

/* ------------------------------------------------------ 提示 / 遮罩 */
.toast-wrap { position: fixed; right: 18px; bottom: 40px; z-index: 400; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 9px 14px; border-radius: 8px; background: var(--bg-elev);
  border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  animation: slidein .18s ease-out; max-width: 380px; line-height: 1.5;
}
.toast.err { border-color: var(--danger); color: var(--danger); }
.toast.ok { border-color: var(--ok); }
@keyframes slidein { from { opacity: 0; transform: translateX(16px); } }

.overlay {
  position: fixed; inset: 0; z-index: 500; background: rgba(16,24,40,.42);
  display: grid; place-items: center;
}
.overlay-card {

<script>
/* ==== src/00-core.js ==== */
/* ============================================================================
 * 00-core.js — 基础设施层
 *   职责：全局命名空间、事件总线（模块解耦 + 插件钩子载体）、通用工具函数。
 *   依赖：无（本文件必须是第一个加载的模块，且不触碰 DOM，便于 Node 单测）。
 * ========================================================================== */
(function (global) {
  'use strict';

  const NT = (global.NT = global.NT || {});
  /* 版本号：全项目唯一来源是 desktop/package.json 的 "version"。
   *   · 改版本请用 `node bump-version.js patch|minor|major|X.Y.Z`（会同时改这里）；
   *   · build.py 打包时还会用 package.json 覆盖此字面量，确保交付产物一定正确；
   *   · core.test.js 有一条断言校验此处与 package.json 一致，漂移会被测出来。*/
  NT.version = '1.0.1';

  /* ------------------------------------------------------------------ 事件总线
   * 全局单例。约定的事件名（节选）：
   *   doc:change       文档内容变更    { doc, changes }
   *   doc:dirty        脏标记变更      { doc, dirty }
   *   doc:open/close   文档生命周期
   *   view:selection   选区/光标变更   { doc, sel, active }
   *   view:render      一帧渲染完成    { doc, first, last }
   *   cmd:before/after 命令执行前后（宏引擎依赖 cmd:after 录制）
   *   plugin:loaded    插件激活完成
   * 通配监听 '*' 会收到 { event, payload }，插件借此做统一审计。
   * ------------------------------------------------------------------------ */
  class EventBus {
    constructor() {
      this._h = new Map();
      this.trace = false;
      this.log = [];
    }
    on(event, fn) {
      let set = this._h.get(event);
      if (!set) { set = new Set(); this._h.set(event, set); }
      set.add(fn);
      return () => this.off(event, fn);   // 返回取消订阅函数
    }
    off(event, fn) {
      const set = this._h.get(event);
      if (set) { set.delete(fn); if (!set.size) this._h.delete(event); }
    }
    once(event, fn) {
      const off = this.on(event, (p) => { off(); fn(p); });
      return off;
    }
    emit(event, payload) {
      if (this.trace) {
        this.log.push({ event, t: Date.now() });
        if (this.log.length > 500) this.log.shift();
      }
      const set = this._h.get(event);
      if (set) {
        // 复制一份，允许监听器内部反订阅
        for (const fn of Array.from(set)) {
          try { fn(payload, event); }
          catch (e) { console.error('[EventBus] 监听器异常 @' + event, e); }
        }
      }
      const any = this._h.get('*');
      if (any) {
        for (const fn of Array.from(any)) {
          try { fn({ event, payload }); } catch (e) { /* 忽略 */ }
        }
      }
    }
    /** 返回某事件当前的监听器数量，供调试/测试断言使用 */
    count(event) { return this._h.has(event) ? this._h.get(event).size : 0; }
    clear() { this._h.clear(); }
  }

  NT.EventBus = EventBus;
  NT.bus = new EventBus();

  /* -------------------------------------------------------------- 工具函数 */
  const util = NT.util = {
    clamp: (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v),

    /** 统一的 HTML 转义：高亮层是 innerHTML 渲染的，必须严防 XSS/结构破坏 */
    esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    },
    /** 把 tab 展开为空格后再交给高亮层，保证与 textarea 的列宽一致 */
    expandTabs(s, size) {
      if (s.indexOf('\t') < 0) return s;
      let out = '', col = 0;
      for (const ch of s) {
        if (ch === '\t') { const n = size - (col % size); out += ' '.repeat(n); col += n; }
        else { out += ch; col++; }
      }
      return out;
    },
    debounce(fn, ms) {
      let t = 0;
      return function (...a) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, a), ms);
      };
    },
    throttle(fn, ms) {
      let last = 0, timer = 0, lastArgs = null;
      return function (...a) {
        const now = Date.now();
        lastArgs = a;
        if (now - last >= ms) { last = now; fn.apply(this, a); }
        else if (!timer) {
          timer = setTimeout(() => {
            timer = 0; last = Date.now(); fn.apply(this, lastArgs);
          }, ms - (now - last));
        }
      };
    },
    formatBytes(n) {
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n / 1048576).toFixed(2) + ' MB';
      return (n / 1073741824).toFixed(2) + ' GB';
    },
    isWordChar(ch) { return !!ch && /[\w$\u4e00-\u9fa5]/.test(ch); },
    /** 文件扩展名 → 语言 id */
    langFromPath(path) {
      const m = /\.([A-Za-z0-9_]+)$/.exec(path || '');
      if (!m) return 'plaintext';
      const ext = m[1].toLowerCase();
      const map = NT.LANGUAGES || {};
      for (const id in map) {
        const l = map[id];
        if (l.ext && l.ext.indexOf(ext) >= 0) return id;
      }
      return 'plaintext';
    },
    /** 简易差分：返回新旧文本的公共前缀/后缀，用于把 textarea 的整体输入
     *  还原成一次最小编辑区间，避免每次按键都全量 diff。 */
    diffRange(a, b) {
      const la = a.length, lb = b.length, min = Math.min(la, lb);
      let p = 0;
      while (p < min && a.charCodeAt(p) === b.charCodeAt(p)) p++;
      let s = 0;
      while (s < min - p && a.charCodeAt(la - 1 - s) === b.charCodeAt(lb - 1 - s)) s++;
      return { start: p, oldEnd: la - s, newEnd: lb - s };
    },
    /** 带二分的「最后一个 <= x 的下标」，行/偏移换算的高频路径 */
    lowerBound(arr, x, lo, hi) {
      lo = lo === undefined ? 0 : lo;
      hi = hi === undefined ? arr.length : hi;
      while (lo < hi) {
        const mid = (lo + hi) >>> 1;
        if (arr[mid] <= x) lo = mid + 1; else hi = mid;
      }
      return lo - 1;
    },
    /** 把秒数格式化为 m:ss */
    fmtTime(sec) {
      const m = Math.floor(sec / 60), s = sec % 60;
      return m + ':' + String(s).padStart(2, '0');
    }
  };

  /* --------------------------------------------------------- 简易 LRU 缓存 */
  class LRU {
    constructor(cap) { this.cap = cap; this.map = new Map(); }
    get(k) {
      if (!this.map.has(k)) return undefined;
      const v = this.map.get(k);
      this.map.delete(k); this.map.set(k, v);
      return v;
    }
    set(k, v) {
      if (this.map.has(k)) this.map.delete(k);
      this.map.set(k, v);
      if (this.map.size > this.cap) this.map.delete(this.map.keys().next().value);
    }
    has(k) { return this.map.has(k); }
    clear() { this.map.clear(); }
    get size() { return this.map.size; }
  }
  NT.LRU = LRU;

  /* ------------------------------------------------------- 微任务让步调度器
   * 大文件解析必须切片执行并主动让出主线程，否则页面会卡死。
   *
   * 为什么不能只用 requestAnimationFrame：
   *   rAF 只在页面「可见且需要绘制」时触发。标签页切到后台、或运行在无头浏览器里时，
   *   rAF 会被节流到 1Hz 甚至完全停摆 —— 此时基于 rAF 的让步会让分片加载近乎卡死
   *   （实测 100 万行/37MB 场景下会从 ~1s 退化到 300s 以上）。
   *
   * 因此策略为：
   *   1) 优先 scheduler.yield()（Chromium 原生，语义最准确）
   *   2) 页面可见 → rAF + setTimeout（保证真的绘制了一帧，进度条能动）
   *   3) 页面不可见 → MessageChannel（宏任务让步，无 4ms 钳制，不受可见性影响）
   *   4) 兜底 setTimeout(0)
   * ---------------------------------------------------------------------- */
  const _mc = typeof MessageChannel !== 'undefined' ? new MessageChannel() : null;
  const _mcQueue = [];
  if (_mc) _mc.port1.onmessage = () => { const fn = _mcQueue.shift(); if (fn) fn(); };

  NT.yieldToUI = function yieldToUI() {
    return new Promise((resolve) => {
      if (global.scheduler && typeof global.scheduler.yield === 'function') {
        global.scheduler.yield().then(resolve, resolve);
        return;
      }
      const doc = global.document;
      const visible = !doc || doc.hidden === false;
      if (visible && typeof global.requestAnimationFrame === 'function') {
        global.requestAnimationFrame(() => global.setTimeout(resolve, 0));
        return;
      }
      if (_mc) { _mcQueue.push(resolve); _mc.port2.postMessage(0); return; }
      setTimeout(resolve, 0);
    });
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== src/10-document.js ==== */
/* ============================================================================
 * 10-document.js — 文档模型层（Model）
 *
 * 设计决策：
 *  · 采用「行数组 + 惰性行起始偏移表」而非单一大字符串。
 *    大字符串做插入时是 O(n) 拷贝，而行数组的 splice 只移动指针；
 *    行起始偏移表用「脏标记 + 后缀重算」维护，在文件尾部编辑是 O(1)，
 *    在文件头部编辑是 O(剩余行数)，实测 50 万行约 1~2ms，可接受。
 *    （工业级实现会换成 Fenwick 树 / Rope，见 ARCHITECTURE.md 的演进路线）
 *  · 编辑统一抽象为 Change{start, removed, inserted}，天然可逆 → 撤销栈零成本。
 *  · 撤销栈按「事务组」聚合：连续输入合并成一条，替换全部合并成一条。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});
  const U = NT.util;

  /* ------------------------------------------------------------------ Change */
  class Change {
    constructor(start, removed, inserted) {
      this.start = start;       // 起始字符偏移
      this.removed = removed;   // 被删除的文本
      this.inserted = inserted; // 新插入的文本
    }
    get end() { return this.start + this.removed.length; }
    get delta() { return this.inserted.length - this.removed.length; }
    invert() { return new Change(this.start, this.inserted, this.removed); }
    toString() { return `Change@${this.start} -${this.removed.length} +${this.inserted.length}`; }
  }
  NT.Change = Change;

  /* ---------------------------------------------------------------- Document */
  class Document {
    constructor(text, opts) {
      opts = opts || {};
      this.id = Document._uid++;
      this.lines = [];
      this._starts = [0];          // 每行起始偏移
      this._dirtyFrom = 0;         // 从此行起的 _starts 失效
      this._len = 0;               // 字符总数（不含行分隔符）
      this.eol = '\n';
      this.path = opts.path || null;
      this.name = opts.name || null;
      this.language = opts.language || 'plaintext';
      this.dirty = false;
      this.readOnly = false;

      this.undoStack = [];
      this.redoStack = [];
      this.maxUndo = 300;
      this._savedDepth = 0;        // 上次保存时的撤销栈深度，用于精确判定"是否有未保存改动"
      this._batch = null;
      this._lastPush = 0;          // 输入合并的时间窗
      this._subs = new Set();
      this._statsCache = null;

      // 折叠状态挂在文档上，切换标签页后得以保留
      this.collapsed = new Set();
      this.folds = null;
      this.foldsVersion = -1;
      this.marks = [];             // 书签/断点行号（插件可读写）

      this.version = 0;            // 每次内容变更 +1，渲染缓存据此失效
      this.sel = { anchor: 0, head: 0 };

      this.setText(text === undefined || text === null ? '' : String(text));
      this.dirty = false;
      this.undoStack.length = 0;
      this.redoStack.length = 0;
    }

    /* ---------------------------------------------------------- 生命周期 */
    setText(text) {
      text = String(text);
      if (text.indexOf('\r') >= 0) {
        this.eol = /\r\n/.test(text) ? '\r\n' : '\r';
        text = text.replace(/\r\n?/g, '\n');
      } else this.eol = '\n';
      this.lines = text.split('\n');
      this._len = text.length;
      this._dirtyFrom = 0;
      this._ensureIndex();
      this.version++;
      this.folds = null; this.foldsVersion = -1;
      this.collapsed.clear();
      this.sel = { anchor: 0, head: 0 };
      this._statsCache = null;
      this._byteSize = undefined;
      this.undoStack.length = 0;
      this.redoStack.length = 0;
      this._savedDepth = 0;
      this._fire([{ type: 'reset' }]);
    }

    subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); }
    _fire(changes) {
      this._statsCache = null;
      for (const fn of Array.from(this._subs)) {
        try { fn(this, changes); } catch (e) { console.error('[Document] 订阅者异常', e); }
      }
      NT.bus.emit('doc:change', { doc: this, changes });
    }

    /* ------------------------------------------------------ 偏移索引维护 */
    _ensureIndex() {
      if (this._dirtyFrom === Number.POSITIVE_INFINITY) return;
      const lines = this.lines, starts = this._starts;
      let off = this._dirtyFrom === 0 ? 0 : starts[this._dirtyFrom];
      for (let i = this._dirtyFrom, n = lines.length; i < n; i++) {
        starts[i] = off;
        off += lines[i].length + 1;
      }
      starts.length = lines.length;
      this._dirtyFrom = Number.POSITIVE_INFINITY;
    }

    get lineCount() { return this.lines.length; }
    get length() { return this._len; }
    get lastLine() { return this.lines.length - 1; }

    /** 偏移 → {line, col}。二分查找，O(log n) */
    positionAt(offset) {
      this._ensureIndex();
      offset = U.clamp(offset | 0, 0, this._len);
      const i = U.lowerBound(this._starts, offset);
      const line = i < 0 ? 0 : i;
      return { line, col: offset - this._starts[line] };
    }
    /** {line, col} → 偏移，O(log n)（_ensureIndex 摊销后为 O(1)） */
    offsetAt(line, col) {
      this._ensureIndex();
      line = U.clamp(line | 0, 0, this.lines.length - 1);
      const len = this.lines[line].length;
      col = U.clamp(col | 0, 0, len);
      return this._starts[line] + col;
    }
    lineAt(line) {
      return this.lines[U.clamp(line | 0, 0, this.lines.length - 1)];
    }
    lineLength(line) {
      const l = this.lines[line];
      return l === undefined ? 0 : l.length;
    }
    /** 某行的结束偏移（不含换行符） */
    lineEndOffset(line) {
      return this.offsetAt(line, this.lineLength(line));
    }

    getRange(start, end) {
      this._ensureIndex();
      if (start >= end) return '';
      const a = this.positionAt(start), b = this.positionAt(end);
      if (a.line === b.line) return this.lines[a.line].slice(a.col, b.col);
      const out = [this.lines[a.line].slice(a.col)];
      for (let i = a.line + 1; i < b.line; i++) out.push(this.lines[i]);
      out.push(this.lines[b.line].slice(0, b.col));
      return out.join('\n');
    }

    getText(range) {
      if (!range) return this.lines.join('\n');
      return this.getRange(range[0], range[1]);
    }

    /* ------------------------------------------------------------ 编辑操作 */
    _apply(ch) {
      this._ensureIndex();
      const a = this.positionAt(ch.start);
      const b = this.positionAt(ch.start + ch.removed.length);
      const head = this.lines[a.line].slice(0, a.col);
      const tail = this.lines[b.line].slice(b.col);
      const mid = ch.inserted.split('\n');
      mid[0] = head + mid[0];
      mid[mid.length - 1] = mid[mid.length - 1] + tail;
      const delCount = b.line - a.line + 1;
      const sameLine = delCount === 1 && mid.length === 1;   // 行数不变的单行内编辑
      if (delCount === mid.length) {
        for (let i = 0; i < mid.length; i++) this.lines[a.line + i] = mid[i];
      } else {
        this.lines.splice(a.line, delCount, ...mid);
      }
      const dLen = ch.inserted.length - ch.removed.length;
      this._len += dLen;

      if (sameLine) {
        // 单行内编辑：行数不变，行起始偏移表只需把该行之后的部分整体平移 dLen。
        //
        // 这里必须「显式平移」而不是「打脏标记」，原因是一处会退化成 O(N²) 的陷阱：
        //   _ensureIndex 的重算成本 = (总行数 - _dirtyFrom)，
        //   而 replaceAll 为了不让偏移失效是**从后向前**逐处替换的，
        //   于是 _dirtyFrom 每次都往前挪一行，重算长度 1、2、3 … N 递增。
        //   实测 21 万行「全部替换」因此要 69 秒，表现为界面假死。
        // 平移之后索引始终精确有效，单次编辑成本降为 O(该行之后的行数)；
        // 对从后向前的批量替换即为 O(1)，整体回到 O(N)。
        if (dLen !== 0) {
          const starts = this._starts, n = this.lines.length;
          for (let j = a.line + 1; j < n; j++) starts[j] += dLen;
        }
      } else {
        this._dirtyFrom = Math.min(this._dirtyFrom, a.line);
      }
      this.version++;
      this.folds = null; this.foldsVersion = -1;   // 折叠结构随内容失效
      return ch;
    }

    /**
     * 核心编辑入口。所有上层操作最终都收敛到这里。
     * @param {number} start 起始偏移
     * @param {number} end   结束偏移
     * @param {string} text  替换文本
     * @param {object} [opt] {undo:'type'|'delete'|null, sel:{anchor,head}, label}
     */
    replaceRange(start, end, text, opt) {
      opt = opt || {};
      if (start > end) { const t = start; start = end; end = t; }
      const removed = this.getRange(start, end);
      if (!removed && !text) return null;
      const selBefore = { anchor: this.sel.anchor, head: this.sel.head };
      const ch = this._apply(new Change(start, removed, text));

      // 选区维护：编辑点之后的选区整体平移；编辑点之前的保持不变
      const d = ch.delta;
      if (this.sel.anchor >= ch.end) this.sel.anchor += d;
      else if (this.sel.anchor > ch.start) this.sel.anchor = ch.start;
      if (this.sel.head >= ch.end) this.sel.head += d;
      else if (this.sel.head > ch.start) this.sel.head = ch.start;
      if (opt.sel) this.sel = { anchor: opt.sel.anchor, head: opt.sel.head };

      if (opt.undo !== null) this._pushUndo(ch, opt, selBefore);
      this._fire([ch]);
      return ch;
    }

    insert(offset, text, opt) { return this.replaceRange(offset, offset, text, opt); }
    remove(start, end, opt) { return this.replaceRange(start, end, '', opt); }

    /** 在指定行后插入整行（供"复制行/新建行"使用） */
    insertLines(line, arr) {
      const off = this.lineEndOffset(U.clamp(line, 0, this.lastLine));
      const text = '\n' + arr.join('\n');
      return this.replaceRange(off, off, text, { undo: 'type' });
    }
    removeLines(from, to) {
      from = U.clamp(from, 0, this.lastLine);
      to = U.clamp(to, from, this.lastLine);
      const start = this.offsetAt(from, 0);
      let end;
      if (to >= this.lastLine) {
        end = this._len;
        // 末行删除时同时吞掉前一个换行符，避免留下空行
        if (from > 0) { start = this.offsetAt(from - 1, this.lineLength(from - 1)); }
      } else {
        end = this.offsetAt(to + 1, 0);
      }
      return this.replaceRange(start, end, '', { undo: 'delete' });
    }

    /* --------------------------------------------------------- 撤销 / 重做 */
    _pushUndo(ch, opt, selBefore) {
      const now = Date.now();
      const b = this._batch;
      if (b) { b.changes.push(ch); return; }

      const top = this.undoStack[this.undoStack.length - 1];
      // 输入合并：同类型、时间窗内、且偏移连续（或紧邻）的编辑合并为一条撤销记录
      const coalescable =
        opt.undo === 'type' && top && top.kind === 'type' &&
        now - top.time < 900 && top.selAfter === ch.end + ch.delta;

      if (coalescable) {
        top.changes.push(ch);
        top.time = now;
        top.selAfter = ch.end + ch.delta;
        top.selAfterAll = { anchor: this.sel.anchor, head: this.sel.head };
      } else {
        this.undoStack.push({
          kind: opt.undo || 'other',
          label: opt.label || null,
          changes: [ch],
          time: now,
          selBefore: selBefore || { anchor: ch.start, head: ch.start },
          selAfter: ch.end + ch.delta,
          selAfterAll: { anchor: this.sel.anchor, head: this.sel.head }
        });
      }
      this._trimUndo();
      this.redoStack.length = 0;
      this._setDirty(this.undoStack.length !== this._savedDepth);
    }

    /**
     * 撤销栈封顶。淘汰最旧一条时必须同步下移 _savedDepth，
     * 否则栈满（maxUndo=300）后「长度恒等于 300」会让脏标记永远为 false —— 静默丢失未保存提示。
     */
    _trimUndo() {
      while (this.undoStack.length > this.maxUndo) {
        this.undoStack.shift();
        if (this._savedDepth > 0) this._savedDepth--;
      }
    }

    /** 事务：把多次编辑合并为一次撤销单元（替换全部、格式化、宏回放等） */
    beginBatch(label) {
      if (this._batch) return;
      this._batch = { kind: 'batch', label: label || null, changes: [],
                      selBefore: { anchor: this.sel.anchor, head: this.sel.head }, time: Date.now() };
    }
    endBatch() {
      const b = this._batch;
      if (!b) return;
      this._batch = null;
      if (!b.changes.length) return;
      b.selAfterAll = { anchor: this.sel.anchor, head: this.sel.head };
      b.selAfter = this.sel.head;
      this.undoStack.push(b);
      this._trimUndo();
      this.redoStack.length = 0;
      this._setDirty(this.undoStack.length !== this._savedDepth);
    }
    cancelBatch() { this._batch = null; }

    undo() {
      const e = this.undoStack.pop();
      if (!e) return false;
      for (let i = e.changes.length - 1; i >= 0; i--) this._apply(e.changes[i].invert());
      this.redoStack.push(e);
      if (e.selBefore) this.sel = { anchor: e.selBefore.anchor, head: e.selBefore.head };
      this._fire([{ type: 'undo', entry: e }]);
      this._setDirty(this.undoStack.length !== this._savedDepth);
      return true;
    }
    redo() {
      const e = this.redoStack.pop();
      if (!e) return false;
      for (const c of e.changes) this._apply(c);
      this.undoStack.push(e);
      if (e.selAfterAll) this.sel = { anchor: e.selAfterAll.anchor, head: e.selAfterAll.head };
      this._fire([{ type: 'redo', entry: e }]);
      this._setDirty(this.undoStack.length !== this._savedDepth);
      return true;
    }
    canUndo() { return this.undoStack.length > 0; }
    canRedo() { return this.redoStack.length > 0; }

    _setDirty(v) {
      v = !!v;
      if (this.dirty === v) return;
      this.dirty = v;
      NT.bus.emit('doc:dirty', { doc: this, dirty: v });
    }
    /**
     * 标记为「已保存」。
     * 注意这里刻意 **不清空撤销栈**：保存只是一个书签，Ctrl+S 之后仍然必须能 Ctrl+Z 回退，
     * 这是 Notepad++ / VS Code 的一致语义。清空撤销栈会让 _savedDepth 这套保存点追踪
     * 彻底失去意义（两者语义互相抵消）。
     * 脏标记由「当前栈深 ≠ 保存点栈深」推导，因此撤销回保存点会正确地重新变干净。
     */
    markClean() {
      this._savedDepth = this.undoStack.length;
      this._setDirty(false);
    }

    /* ---------------------------------------------------------------- 选区 */
    setSel(anchor, head) {
      this.sel = { anchor: anchor | 0, head: head === undefined ? (anchor | 0) : head | 0 };
    }
    selRange() {
      const a = this.sel.anchor, h = this.sel.head;
      return a <= h ? { start: a, end: h } : { start: h, end: a };
    }
    selText() { const r = this.selRange(); return this.getRange(r.start, r.end); }
    hasSel() { return this.sel.anchor !== this.sel.head; }
    /** 选中的完整行范围（含部分选中行） */
    selLineRange() {
      const r = this.selRange();
      const a = this.positionAt(r.start), b = this.positionAt(r.end);
      let endLine = b.line;
      if (b.col === 0 && r.end > r.start) endLine = Math.max(a.line, b.line - 1);
      return { from: a.line, to: endLine };
    }

    /* ---------------------------------------------------------------- 统计 */
    stats() {
      if (this._statsCache && this._statsCache.version === this.version) return this._statsCache;
      let chars = 0, charsNoSpace = 0, words = 0, nonEmpty = 0;
      const lines = this.lines;
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        chars += l.length;
        for (let j = 0; j < l.length; j++) {
          const c = l.charCodeAt(j);
          if (c !== 32 && c !== 9) charsNoSpace++;
        }
        if (l.trim()) nonEmpty++;
        const m = l.match(/[\w\u4e00-\u9fa5$]+/g);
        if (m) words += m.length;
      }
      this._statsCache = {
        version: this.version, lines: lines.length, nonEmpty, chars,
        charsNoSpace, words, bytes: this._len + (lines.length - 1)
      };
      return this._statsCache;
    }

    /* ------------------------------------------------------------ 语言/元信息 */
    setLanguage(id) {
      if (this.language === id) return;
      this.language = id;
      this.folds = null; this.foldsVersion = -1;
      NT.bus.emit('doc:language', { doc: this, language: id });
    }
    setPath(path) {
      this.path = path;
      this.name = path ? path.split(/[\\/]/).pop() : this.name;
      const guess = U.langFromPath(path);
      if (guess !== 'plaintext') this.setLanguage(guess);
    }

    /**
     * UTF-8 字节大小（惰性计算并缓存）。
     * 用于性能档位判定：浏览器里字符串长度 ≠ 字节数，中文/emoji 差异很大。
     * 采用抽样估算（前 64K 字符的字符密度 × 总长度），避免为判定档位而遍历整个文档。
     */
    get byteSize() {
      if (this._byteSize !== undefined && this._byteSizeVersion === this.version) return this._byteSize;
      const sampleLen = Math.min(this._len, 65536);
      let bytes = 0;
      if (sampleLen === 0) {
        bytes = 0;
      } else {
        let n = 0, i = 0;
        outer: for (const line of this.lines) {
          for (let k = 0; k < line.length; k++) {
            const c = line.charCodeAt(k);
            bytes += c < 0x80 ? 1 : c < 0x800 ? 2 : (c >= 0xd800 && c <= 0xdbff) ? 4 : 3;
            if (++n >= sampleLen) break outer;
          }
          bytes += 1; // 换行符
          if (++n >= sampleLen) break outer;
        }
        const density = bytes / n;
        bytes = Math.round(this._len * density) + (this.lines.length - 1);
      }
      this._byteSize = bytes;
      this._byteSizeVersion = this.version;
      return bytes;
    }
  }

  Document._uid = 1;
  NT.Document = Document;

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== src/20-languages.js ==== */
/* ============================================================================
 * 20-languages.js — 语法高亮 / 词法分析层
 *
 * 架构：一条「带跨行状态的规则式分词器」+ 一份纯数据语言定义表。
 *   · 语言定义 = 有序规则数组。规则是 {t: 语义类型, re: 粘性正则, if/set: 上下文钩子}
 *     顺序敏感：先匹配者胜出，因此注释/字符串必须排在最前。
 *   · 跨行状态 state = { block: {close, type} }，用于块注释、三引号字符串、代码围栏。
 *     分词器是纯函数：tokenize(lang, line, stateIn) → { tokens, stateOut }，
 *     因此可以在「可见行虚拟化」的前提下按需增量计算，无需全量扫描。
 *   · ctx 是「行内上下文」，用于 HTML 这类词法上需要看前一个 token 才能判定的语言。
 *
 * 性能约定（渲染层依赖）：
 *   · 超长行（> MAX_LINE_SCAN）只扫描前 N 个字符，其余按纯文本处理，
 *     避免压缩过的单行 JS/CSS 拖垮渲染帧。
 *   · 返回值 tokens 保证对 [0, line.length) 无空洞、无重叠，可直接拼 HTML。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});

  const MAX_LINE_SCAN = 4000;
  const INITIAL = Object.freeze({ block: null });

  /* ------------------------------------------------------------ 规则构造器 */
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const R = {
    ws: () => ({ t: 'ws', re: /\s+/y }),
    lineComment: (mark) => ({ t: 'comment', re: new RegExp(escRe(mark) + '[^\\n]*', 'y') }),
    blockComment: (open, close) => ({ t: 'comment', open, close, block: true }),
    keyword: (words) => ({ t: 'keyword', re: new RegExp('(?:' + words.join('|') + ')\\b', 'y') }),
    word: (type, words) => ({ t: type, re: new RegExp('(?:' + words.join('|') + ')\\b', 'y') }),
    str: (q) => ({ t: 'string', re: new RegExp(q + '(?:\\\\[\\s\\S]|[^' + q + '\\\\])*' + q, 'y') }),
    template: () => ({ t: 'string', re: /`(?:\\[\s\S]|[^`\\])*`/y }),
    number: () => ({
      t: 'number',
      re: /\b(?:0[xX][0-9a-fA-F][0-9a-fA-F_]*|0[bB][01_]+|0[oO][0-7_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:[eE][+-]?\d+)?)[nNfFlLdDmMuU]*\b/y
    }),
    funcCall: () => ({ t: 'func', re: /[A-Za-z_$][\w$]*(?=\s*\()/y }),
    ident: () => ({ t: 'var', re: /[A-Za-z_$\u00c0-\uffff][\w$\u00c0-\uffff]*/y }),
    punct: (s) => ({ t: 'punct', re: new RegExp('[' + escRe(s).replace(/\\-/g, '\\-') + ']', 'y') }),
    op: (re) => ({ t: 'op', re })
  };

  /* 把语言定义里的 block 规则编译成粘性正则（只匹配开标记） */
  function compile(lang) {
    const rules = [];
    for (const r of lang.rules || []) {
      if (r.block) {
        rules.push({
          t: r.t, open: r.open, close: r.close, block: true,
          re: new RegExp(escRe(r.open), 'y')
        });
      } else {
        rules.push(r);
      }
    }
    lang._rules = rules;
    return lang;
  }

  /* ---------------------------------------------------------------- 分词器 */
  /**
   * @param {object} lang 语言定义（内部 _rules 已编译）
   * @param {string} line 单行文本（不含换行符）
   * @param {object} stateIn 上一行遗留状态
   * @returns {{tokens: Array<{s:number,e:number,t:string}>, state: object}}
   */
  function tokenize(lang, line, stateIn) {
    const tokens = [];
    const state = stateIn || INITIAL;
    const rules = lang._rules;
    if (!rules || !rules.length) return { tokens: line ? [{ s: 0, e: line.length, t: 'var' }] : [], state };

    let n = line.length;
    if (n > MAX_LINE_SCAN) n = MAX_LINE_SCAN;   // 超长行截断扫描
    let i = 0;
    let block = state.block;
    const ctx = {};

    // (1) 延续上一行未闭合的块（块注释 / 三引号 / 代码围栏）
    if (block) {
      const idx = line.indexOf(block.close, 0);
      if (idx < 0) {
        if (n) tokens.push({ s: 0, e: n, t: block.type });
        if (n < line.length) tokens.push({ s: n, e: line.length, t: 'var' });
        return { tokens, state: { block } };
      }
      const end = idx + block.close.length;
      tokens.push({ s: 0, e: end, t: block.type });
      i = end;
      block = null;
    }

    const nRules = rules.length;
    while (i < n) {
      let matched = false;
      for (let k = 0; k < nRules; k++) {
        const r = rules[k];
        if (r.if && !r.if(ctx)) continue;
        r.re.lastIndex = i;
        const m = r.re.exec(line);
        if (!m || m.index !== i) continue;

        if (r.block) {
          // 需要跨行延续的规则：找闭合标记
          const searchFrom = i + r.open.length;
          const ci = line.indexOf(r.close, searchFrom);
          if (ci < 0 || ci >= n) {
            tokens.push({ s: i, e: n, t: r.t });
            if (n < line.length) tokens.push({ s: n, e: line.length, t: 'var' });
            return { tokens, state: { block: { close: r.close, type: r.t } } };
          }
          const end = ci + r.close.length;
          tokens.push({ s: i, e: end, t: r.t });
          i = end;
        } else {
          const end = i + m[0].length;
          tokens.push({ s: i, e: end, t: r.t });
          i = end;
        }
        if (r.set) r.set(ctx, m);
        matched = true;
        break;
      }
      if (!matched) { tokens.push({ s: i, e: i + 1, t: 'var' }); i++; }
    }
    // 超长行尾部按纯文本补齐，保证 token 覆盖完整
    if (n < line.length) tokens.push({ s: n, e: line.length, t: 'var' });

    return { tokens, state: { block } };
  }

  /* ================================================================ 语言表 */

  const JS_KEYWORDS = ['as', 'async', 'await', 'break', 'case', 'catch', 'class', 'const',
    'continue', 'debugger', 'default', 'delete', 'do', 'else', 'export', 'extends', 'finally',
    'for', 'from', 'function', 'get', 'if', 'import', 'in', 'instanceof', 'let', 'new', 'of',
    'return', 'set', 'static', 'super', 'switch', 'this', 'throw', 'try', 'typeof', 'var',
    'void', 'while', 'with', 'yield'];
  const JS_LITERALS = ['true', 'false', 'null', 'undefined', 'NaN', 'Infinity'];
  const JS_BUILTINS = ['Array', 'Boolean', 'Date', 'Error', 'Function', 'JSON', 'Map', 'Math',
    'Number', 'Object', 'Promise', 'Proxy', 'RegExp', 'Set', 'String', 'Symbol', 'WeakMap',
    'WeakSet', 'BigInt', 'console', 'document', 'window', 'globalThis', 'process', 'require',
    'module', 'exports', 'Buffer', 'setTimeout', 'setInterval', 'clearTimeout', 'fetch',
    'localStorage', 'sessionStorage', 'Intl', 'Reflect', 'Atomics', 'ArrayBuffer', 'Uint8Array'];

  function jsRules() {
    return [
      R.ws(),
      R.lineComment('//'),
      R.blockComment('/*', '*/'),
      R.template(),
      R.str('"'), R.str("'"),
      R.number(),
      R.keyword(JS_KEYWORDS),
      R.word('keyword', JS_LITERALS),
      R.word('builtin', JS_BUILTINS),
      R.funcCall(),
      R.ident(),
      R.punct('{}[]();,.'),
      R.op(/=>|\.\.\.|[+\-*/%=<>!&|^~?:]+/y)
    ];
  }

  function cLikeRules(keywords, types, literals, extra) {
    const rules = [
      R.ws(),
      R.lineComment('//'),
      R.blockComment('/*', '*/'),
      R.str('"'), R.str("'"),
      R.number(),
      R.keyword(keywords),
      R.word('type', types),
      R.word('keyword', literals),
      R.funcCall(),
      R.ident(),
      R.punct('{}[]();,.'),
      R.op(/->|::|<<=?|>>=?|[+\-*/%=<>!&|^~?:]+/y)
    ];
    return extra ? extra.concat(rules) : rules;
  }

  const LANGS = {};

  function def(id, cfg) { LANGS[id] = compile(Object.assign({ id }, cfg)); }

  def('plaintext', { name: '纯文本', ext: [], rules: [] });

  def('javascript', {
    name: 'JavaScript', ext: ['js', 'mjs', 'cjs', 'jsx'],
    comment: { line: '//', block: ['/*', '*/'] },
    keywords: JS_KEYWORDS, builtins: JS_BUILTINS,
    rules: jsRules()
  });

  def('typescript', {
    name: 'TypeScript', ext: ['ts', 'tsx', 'mts', 'cts'],
    comment: { line: '//', block: ['/*', '*/'] },
    keywords: JS_KEYWORDS.concat(['abstract', 'declare', 'enum', 'implements', 'interface',
      'is', 'keyof', 'namespace', 'private', 'protected', 'public', 'readonly', 'satisfies',
      'type', 'infer', 'asserts', 'override', 'module']),
    builtins: JS_BUILTINS.concat(['Partial', 'Required', 'Readonly', 'Record', 'Pick', 'Omit',
      'Exclude', 'Extract', 'NonNullable', 'ReturnType', 'Awaited', 'any', 'unknown', 'never',
      'void', 'string', 'number', 'boolean', 'object', 'symbol', 'bigint']),
    rules: jsRules()
  });

  def('python', {
    name: 'Python', ext: ['py', 'pyw', 'pyi'],
    comment: { line: '#' },
    rules: [
      R.ws(),
      R.lineComment('#'),
      // 三引号字符串需要跨行，放在普通字符串之前
      { t: 'string', open: '"""', close: '"""', block: true },
      { t: 'string', open: "'''", close: "'''", block: true },
      { t: 'string', re: /(?:[rRbBuUfF]{0,2})"(?:\\[\s\S]|[^"\\])*"/y },
      { t: 'string', re: /(?:[rRbBuUfF]{0,2})'(?:\\[\s\S]|[^'\\])*'/y },
      R.number(),
      R.keyword(['and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def',
        'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import',
        'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try',
        'while', 'with', 'yield', 'match', 'case']),
      R.word('keyword', ['True', 'False', 'None', 'NotImplemented', 'Ellipsis']),
      R.word('builtin', ['abs', 'all', 'any', 'bin', 'bool', 'bytes', 'callable', 'chr',
        'classmethod', 'compile', 'complex', 'dict', 'dir', 'divmod', 'enumerate', 'eval',
        'exec', 'filter', 'float', 'format', 'frozenset', 'getattr', 'globals', 'hasattr',
        'hash', 'help', 'hex', 'id', 'input', 'int', 'isinstance', 'issubclass', 'iter',
        'len', 'list', 'locals', 'map', 'max', 'memoryview', 'min', 'next', 'object', 'oct',
        'open', 'ord', 'pow', 'print', 'property', 'range', 'repr', 'reversed', 'round',
        'set', 'setattr', 'slice', 'sorted', 'staticmethod', 'str', 'sum', 'super', 'tuple',
        'type', 'vars', 'zip', 'self', 'cls']),
      { t: 'func', re: /[A-Za-z_]\w*(?=\s*\()/y },
      R.ident(),
      R.punct('{}[]();,.:'),
      R.op(/->|:=|[+\-*/%=<>!&|^~@]+/y)
    ]
  });

  def('html', {
    name: 'HTML', ext: ['html', 'htm', 'vue', 'svelte', 'xhtml'],
    comment: { block: ['<!--', '-->'] },
    rules: [
      { t: 'comment', open: '<!--', close: '-->', block: true },
      R.ws(),
      { t: 'type', re: /<!DOCTYPE[^>]*>/iy },
      { t: 'punct', re: /<\/?/y, set: (c) => { c.inTag = true; c.first = true; } },
      { t: 'punct', re: />/y, set: (c) => { c.inTag = false; } },
      { t: 'punct', re: /\/>/y, set: (c) => { c.inTag = false; } },
      { t: 'tag', re: /[a-zA-Z][\w:.-]*/y, if: (c) => c.inTag && c.first, set: (c) => { c.first = false; } },
      { t: 'attr', re: /[a-zA-Z_:@#][\w:.-]*/y, if: (c) => c.inTag && !c.first },
      { t: 'string', re: /"[^"]*"|'[^']*'/y },
      { t: 'op', re: /=/y },
      { t: 'var', re: /[^<>&]+/y },
      { t: 'punct', re: /[<>&]/y }
    ]
  });

  def('xml', {
    name: 'XML', ext: ['xml', 'svg', 'xsl', 'xslt', 'plist', 'csproj'],
    comment: { block: ['<!--', '-->'] },
    rules: LANGS.html.rules
  });

  def('css', {
    name: 'CSS', ext: ['css', 'scss', 'less', 'sass'],
    comment: { block: ['/*', '*/'] },
    rules: [
      R.ws(),
      R.blockComment('/*', '*/'),
      { t: 'keyword', re: /@[\w-]+/y },

<script>
/* ==== src/30-folds.js ==== */
/* ============================================================================
 * 30-folds.js — 代码折叠层
 *
 * 三种折叠来源，合并成一份「折叠区列表」：
 *   1) 括号配对   —— 大括号/中括号/圆括号跨行配对（适用于 C 系、JS、CSS、JSON…）
 *   2) 缩进层级   —— 适用于 Python / YAML / INI 这类无括号语言
 *   3) 显式标记   —— //region / #region … endregion
 *
 * 性能：不走分词器（全量分词在大文件上代价过高），改用「原始字符扫描 + 字符串/注释
 * 跳过」，吞吐约 20~40M 字符/秒。超过 FOLD_LIMIT 行时直接关闭折叠（轻量模式），
 * 并由渲染层给出提示——宁可少一个特性，也不能让编辑卡顿。
 *
 * 折叠状态（哪些区已收起）存在 Document 上，因此切换标签页/撤销重做后仍然保留。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});
  const U = NT.util;

  const FOLD_LIMIT = 120000;   // 超过此行数关闭折叠计算
  // 闭括号字符码 → 开括号字符码（栈里存的是字符码，必须同类型比较）
  const CLOSE_OF = { 125: 123, 93: 91, 41: 40 };
  const OPEN_CH = { 123: 1, 91: 1, 40: 1 };
  const CLOSE_CH = { 125: 1, 93: 1, 41: 1 };

  /* ------------------------------------------- 扫描 1：括号配对（含注释/字符串跳过） */
  function scanBraces(lines) {
    const out = [];
    const stack = [];
    let inBlock = null;          // 跨行块注释的闭合标记，例如 '*/'

    for (let li = 0, n = lines.length; li < n; li++) {
      const line = lines[li];
      const len = line.length;
      let i = 0;
      while (i < len) {
        if (inBlock) {
          const idx = line.indexOf(inBlock, i);
          if (idx < 0) { i = len; break; }
          i = idx + inBlock.length;
          inBlock = null;
          continue;
        }
        const c = line.charCodeAt(i);
        // 行注释：本行剩余部分全部跳过
        if (c === 47 /* / */) {
          const c2 = line.charCodeAt(i + 1);
          if (c2 === 47) break;
          if (c2 === 42 /* * */) { inBlock = '*/'; i += 2; continue; }
        }
        // 字符串：行内跳过（不处理跨行模板串，代价过高且对折叠影响有限）
        if (c === 34 || c === 39 || c === 96) {
          let j = i + 1;
          while (j < len) {
            const d = line.charCodeAt(j);
            if (d === 92 /* \ */) { j += 2; continue; }
            if (d === c) { j++; break; }
            j++;
          }
          i = j;
          continue;
        }
        if (OPEN_CH[c]) { stack.push({ ch: c, line: li }); i++; continue; }
        if (CLOSE_CH[c]) {
          const top = stack.pop();
          if (top && top.ch === CLOSE_OF[c] && li > top.line) {
            out.push({
              startLine: top.line, endLine: li,
              type: c === 125 ? 'block' : 'paren',
              depth: stack.length
            });
          }
          i++;
          continue;
        }
        i++;
      }
    }
    return out;
  }

  /* ------------------------------------------- 扫描 2：缩进层级（Python / YAML / INI） */
  function scanIndent(lines) {
    const out = [];
    const stack = [];               // {col, line}
    const n = lines.length;

    const colOf = (line) => {
      let col = 0;
      for (let k = 0; k < line.length; k++) {
        const c = line[k];
        if (c === ' ') col++;
        else if (c === '\t') col += 4 - (col % 4);
        else break;
      }
      return col;
    };

    const closeTo = (t, endLine, depth) => {
      let e = endLine;
      while (e > t.line && !lines[e].trim()) e--;   // 末尾空行不计入
      if (e > t.line) out.push({ startLine: t.line, endLine: e, type: 'indent', depth });
    };

    for (let li = 0; li < n; li++) {
      const line = lines[li];
      const trimmed = line.trim();
      if (!trimmed || trimmed[0] === '#') continue;   // 空行与整行注释不参与缩进层级
      const col = colOf(line);
      while (stack.length && stack[stack.length - 1].col >= col) {
        closeTo(stack.pop(), li - 1, stack.length);
      }
      stack.push({ col, line: li });
    }
    while (stack.length) closeTo(stack.pop(), n - 1, stack.length);
    return out;
  }

  /* ------------------------------------------- 扫描 3：显式区域标记 */
  const REGION_RE = /(?:^|\/\/|#|<!--|;|--)\s*(region|endregion)\b/i;
  function scanRegions(lines) {
    const out = [];
    const stack = [];
    for (let li = 0, n = lines.length; li < n; li++) {
      const m = REGION_RE.exec(lines[li]);
      if (!m) continue;
      if (m[1].toLowerCase() === 'region') stack.push(li);
      else {
        const s = stack.pop();
        if (s !== undefined && li > s) {
          out.push({ startLine: s, endLine: li, type: 'region', depth: stack.length });
        }
      }
    }
    return out;
  }

  /* ------------------------------------------------------------------ 计算入口 */
  const INDENT_LANGS = { python: 1, yaml: 1, ini: 1 };

  function compute(doc, langId) {
    langId = langId || doc.language;
    const lines = doc.lines;
    if (lines.length > FOLD_LIMIT) return [];

    let folds = INDENT_LANGS[langId] ? scanIndent(lines) : scanBraces(lines);
    const regions = scanRegions(lines);
    if (regions.length) folds = folds.concat(regions);

    // 排序：起始行升序；同起始行时范围大的在前（便于「取最大范围」）
    folds.sort((a, b) => (a.startLine - b.startLine) || (b.endLine - a.endLine));

    // 去掉完全重复/被同起点更大范围覆盖的项
    const dedup = [];
    for (const f of folds) {
      const prev = dedup[dedup.length - 1];
      if (prev && prev.startLine === f.startLine) continue;
      dedup.push(f);
    }
    return dedup;
  }

  /* --------------------------------------------------------------- FoldModel */
  class FoldModel {
    constructor(doc, folds) {
      this.doc = doc;
      this.folds = folds;
      this.disabled = doc.lines.length > FOLD_LIMIT;
      this.byStart = new Map();
      for (const f of folds) {
        const cur = this.byStart.get(f.startLine);
        if (!cur || f.endLine > cur.endLine) this.byStart.set(f.startLine, f);
      }
      this.collapsed = doc.collapsed || (doc.collapsed = new Set());
      this._rebuildRanges();
    }
    _rebuildRanges() {
      // 把「已收起的折叠区」转成隐藏行区间 [start+1, end]，合并重叠/相邻区间，
      // 得到一份互不相交的升序区间表。此后 isHidden 就是一次二分，O(log n)。
      const ivs = [];
      for (const s of this.collapsed) {
        const f = this.byStart.get(s);
        if (f && f.endLine > f.startLine) ivs.push([f.startLine + 1, f.endLine]);
      }
      ivs.sort((a, b) => (a[0] - b[0]) || (b[1] - a[1]));
      const merged = [];
      for (const iv of ivs) {
        const last = merged[merged.length - 1];
        if (last && iv[0] <= last[1] + 1) { if (iv[1] > last[1]) last[1] = iv[1]; }
        else merged.push([iv[0], iv[1]]);
      }
      this.hidden = merged;
      this._hiddenStarts = merged.map((m) => m[0]);
      // 另存一份按起始行排序的折叠区，供「展开光标所在折叠」使用
      this._sortedFolds = [];
      for (const s of this.collapsed) {
        const f = this.byStart.get(s);
        if (f) this._sortedFolds.push(f);
      }
      this._sortedFolds.sort((a, b) => a.startLine - b.startLine);
    }
    hasFold(line) { return this.byStart.has(line); }
    foldAt(line) { return this.byStart.get(line) || null; }
    isCollapsed(line) { return this.collapsed.has(line); }

    toggle(line) {
      if (!this.byStart.has(line)) return false;
      if (this.collapsed.has(line)) this.collapsed.delete(line);
      else this.collapsed.add(line);   // 收起外层不影响内层的记录状态
      this._rebuildRanges();
      return true;
    }
    collapseAll() {
      this.collapsed.clear();
      for (const f of this.folds) this.collapsed.add(f.startLine);
      this._rebuildRanges();
    }
    expandAll() {
      this.collapsed.clear();
      this._rebuildRanges();
    }
    /** 按层级折叠：level=1 只折叠第一层，2 折叠到第二层，依此类推 */
    collapseLevel(level) {
      this.collapsed.clear();
      for (const f of this.folds) if (f.depth < level) this.collapsed.add(f.startLine);
      this._rebuildRanges();
    }
    /** 某文档行是否被隐藏（位于任一已收起区间内部）。一次二分，O(log n)。 */
    isHidden(line) {
      if (!this.hidden.length) return false;
      const i = U.lowerBound(this._hiddenStarts, line);
      return i >= 0 && line <= this.hidden[i][1];
    }
    /** 找到包含该行的最内层已收起折叠（用于把光标/选区夹回可见区） */
    enclosingCollapsed(line) {
      let best = null;
      const arr = this._sortedFolds || [];
      for (const r of arr) {
        if (r.startLine >= line) break;
        if (line <= r.endLine) best = r;
      }
      return best;
    }
    /** 展开所有包含该行的折叠，返回是否有变化 */
    expandAround(line) {
      let changed = false;
      for (const s of Array.from(this.collapsed)) {
        const f = this.byStart.get(s);
        if (f && line > f.startLine && line <= f.endLine) { this.collapsed.delete(s); changed = true; }
      }
      if (changed) this._rebuildRanges();
      return changed;
    }
    get count() { return this.folds.length; }
  }

  /** 取（并按需计算）文档的折叠模型，结果缓存在 doc 上 */
  function ensure(doc) {
    if (doc.folds && doc.foldsVersion === doc.version) return doc.folds;
    const folds = compute(doc, doc.language);
    doc.folds = new FoldModel(doc, folds);
    doc.foldsVersion = doc.version;
    return doc.folds;
  }

  NT.folds = {
    FOLD_LIMIT, compute, ensure, FoldModel,
    scanBraces, scanIndent, scanRegions,
    isIndentLanguage: (id) => !!INDENT_LANGS[id]
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;

<script>
/* ==== src/40-view.js ==== */
/* ============================================================================
 * 40-view.js — 编辑器视图层（View / 渲染引擎）
 *
 * 结构：经典「透明 textarea + 高亮层叠加」
 *   <div class="nt-editor">
 *     <div class="nt-gutter">        行号槽（可见行虚拟化）
 *     <div class="nt-scroll">
 *       <div class="nt-curline">     当前行底色
 *       <pre class="nt-hl">         语法着色层（可见行虚拟化，transform 平移）
 *       <textarea>                  真实输入控件（文字透明，仅保留光标与选区）
 *
 * 三个必须对齐的东西：字体、行高、内边距。它们全部由 CSS 变量统一下发，
 * 视图层只读一次 getComputedStyle 得到 metrics，之后不再重算。
 *
 * 【折叠与 textarea 的矛盾及解法】
 * textarea 无法"隐藏"某几行，因此折叠必须体现为「视图文本 ≠ 文档文本」：
 *   · 无折叠时：viewText === doc.text，视图行 == 文档行 → 所有映射退化为恒等，热路径 O(1)
 *   · 有折叠时：维护 ViewMap（视图行 → 文档行），折叠区在视图里压缩成一行占位符，
 *     输入时用「公共前后缀差分」把视图编辑还原成文档编辑。
 *   由于折叠只在小文件上启用（FOLD_LIMIT），有折叠时的全量重建代价可以接受。
 *
 * 【大文件策略】
 *   · 渲染只处理可见行 ± OVERSCAN，行号槽与高亮层同样只渲染可见部分；
 *   · 分词结果按行缓存，并维护「行首词法状态」前缀链，编辑后只失效受影响的后缀；
 *   · 超过阈值自动进入轻量模式（关闭分词/折叠/文档词补全）。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});
  const U = NT.util;

  const OVERSCAN = 24;          // 可见区上下各多渲染的行数
  const CATCHUP = 20000;        // 状态链最多向前补算的行数，超出则放弃精确状态
  const PLACEHOLDER = (n) => '⋯ 已折叠 ' + n + ' 行 ⋯';

  class EditorView {
    constructor(host, app) {
      this.host = host;
      this.app = app;
      this.doc = null;
      this.foldModel = null;

      this.viewToDoc = [];        // 仅在有折叠时有效
      this.foldAtView = new Map();
      this.viewText = '';
      this._viewStarts = [];
      this._viewDirtyFrom = Infinity;

      this.tokenCache = new Map();  // docLine -> {html, state}
      this.lineStates = [];         // docLine -> stateOut
      this._maxStateIndex = -1;

      this.decorators = [];         // 插件装饰器：fn(docLine, lineText) => [{s,e,cls}]
      this.searchMatches = [];
      this._matchByLine = new Map();
      this.activeMatchIndex = -1;

      this.lightweight = false;
      this.composing = false;
      this.ac = null;               // 补全控制器（由 50-completion.js 装配）

      this.metrics = { lh: 20, cw: 8, padTop: 8, padLeft: 14, digits: 3 };
      this._rafPending = false;
      this._lastRender = { first: -1, last: -1, version: -1 };

      this._buildDom();
      this._bindEvents();
      this._measure();
    }

    /* ------------------------------------------------------------ DOM 构建 */
    _buildDom() {
      const wrap = document.createElement('div');
      wrap.className = 'nt-editor';
      wrap.innerHTML =
        '<div class="nt-gutter"><div class="nt-gutter-inner"></div></div>' +
        '<div class="nt-scroll">' +
          '<div class="nt-curline"></div>' +
          '<pre class="nt-hl"><code></code></pre>' +
          '<textarea class="nt-input" spellcheck="false" autocomplete="off" ' +
            'autocorrect="off" autocapitalize="off" wrap="off"></textarea>' +
        '</div>';
      this.el = wrap;
      this.gutter = wrap.querySelector('.nt-gutter');
      this.gutterInner = wrap.querySelector('.nt-gutter-inner');
      this.scroll = wrap.querySelector('.nt-scroll');
      this.curLine = wrap.querySelector('.nt-curline');
      this.hl = wrap.querySelector('.nt-hl');
      this.hlCode = wrap.querySelector('.nt-hl code');
      this.input = wrap.querySelector('.nt-input');
      this.host.appendChild(wrap);
    }

    _measure() {
      const cs = getComputedStyle(this.input);
      const font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      const ctx = EditorView._measureCtx ||
        (EditorView._measureCtx = document.createElement('canvas').getContext('2d'));
      ctx.font = font;
      const w = ctx.measureText('MMMMMMMMMMMMMMMMMMMM').width / 20;
      this.metrics.cw = w > 0 ? w : 8;
      this.metrics.lh = parseFloat(cs.lineHeight) || 20;
      this.metrics.padTop = parseFloat(cs.paddingTop) || 8;
      this.metrics.padLeft = parseFloat(cs.paddingLeft) || 14;
    }

    /* ------------------------------------------------------------ 事件绑定 */
    _bindEvents() {
      const inp = this.input;

      inp.addEventListener('input', () => this._onInput());
      inp.addEventListener('scroll', () => this.scheduleRender(), { passive: true });
      inp.addEventListener('keydown', (e) => this._onKeyDown(e));
      inp.addEventListener('compositionstart', () => { this.composing = true; });
      inp.addEventListener('compositionend', () => { this.composing = false; this._onInput(); });
      ['click', 'keyup', 'select', 'mouseup'].forEach((ev) =>
        inp.addEventListener(ev, () => this._syncSelection()));

      // 行号槽：折叠标记点击（事件委托）
      this.gutter.addEventListener('mousedown', (e) => {
        const f = e.target.closest && e.target.closest('.ln-fold');
        if (!f) return;
        e.preventDefault();
        e.stopPropagation();
        const line = parseInt(f.parentElement.dataset.line, 10);
        this.toggleFold(line);
      });

      window.addEventListener('resize', U.debounce(() => { this._measure(); this.render(); }, 120));
    }

    /* --------------------------------------------------------- 文档装配 */
    setDocument(doc, opts) {
      opts = opts || {};
      this.doc = doc;
      this.lightweight = this._shouldLightweight(doc);
      this.foldModel = this.lightweight ? null : NT.folds.ensure(doc);
      this._resetCaches();
      this._rebuildViewMap();
      this._rebuildViewText();
      this.input.value = this.viewText;
      this.input.scrollTop = opts.scrollTop || 0;
      this.input.scrollLeft = 0;
      this._updateGutterWidth();
      this.setSelFromDoc();
      this.render(true);
    }

    _shouldLightweight(doc) {
      const maxLines = (this.app && this.app.settings && this.app.settings.lightweightLines) || 120000;
      const maxBytes = (this.app && this.app.settings && this.app.settings.lightweightBytes) || 4 * 1024 * 1024;
      return doc.lines.length > maxLines || doc.byteSize > maxBytes;
    }

    _resetCaches() {
      this.tokenCache.clear();
      this.lineStates = [];
      this._maxStateIndex = -1;
    }

    get tabSize() { return (this.app && this.app.settings && this.app.settings.tabSize) || 4; }
    get hasFolds() { return !!(this.foldModel && this.foldModel.collapsed.size); }
    get viewLineCount() { return this.hasFolds ? this.viewToDoc.length : (this.doc ? this.doc.lines.length : 0); }
    docLineOf(v) { return this.hasFolds ? this.viewToDoc[v] : v; }

    /** 文档行 → 视图行。若该行被折叠隐藏，返回其所属折叠的起始行对应的视图行 */
    viewLineOf(docLine) {
      if (!this.hasFolds) return docLine;
      const i = U.lowerBound(this.viewToDoc, docLine);
      // v2d 中占位行与折叠起始行指向同一个文档行，lowerBound 会命中占位行，
      // 此时回退一格拿到真正可见的折叠起始行
      if (i > 0 && this.foldAtView.has(i)) return i - 1;
      return i < 0 ? 0 : i;
    }

    /* --------------------------------------------------- ViewMap / ViewText */
    _rebuildViewMap() {
      const doc = this.doc;
      const v2d = [];
      const foldAtView = new Map();
      const n = doc.lines.length;
      if (!this.hasFolds) {
        this.viewToDoc = v2d;
        this.foldAtView = foldAtView;
        this._viewDirtyFrom = Infinity;
        return;
      }
      const collapsed = this.foldModel.collapsed;
      for (let i = 0; i < n; i++) {
        v2d.push(i);                       // 折叠起始行本身仍然可见
        if (collapsed.has(i)) {
          const f = this.foldModel.foldAt(i);
          if (f && f.endLine > i) {
            // 追加一个「占位行」，它映射回折叠起始行（保证 v2d 单调不减，
            // 二分查找依然成立），真正身份由 foldAtView 标记
            v2d.push(i);
            foldAtView.set(v2d.length - 1, {
              startLine: i, endLine: f.endLine, count: f.endLine - i
            });
            i = f.endLine;
          }
        }
      }
      this.viewToDoc = v2d;
      this.foldAtView = foldAtView;
      this._viewDirtyFrom = 0;
    }

    _rebuildViewText() {
      if (!this.hasFolds) { this.viewText = this.doc.getText(); return; }
      const v2d = this.viewToDoc;
      const parts = new Array(v2d.length);
      for (let i = 0; i < v2d.length; i++) {
        const f = this.foldAtView.get(i);
        parts[i] = f ? PLACEHOLDER(f.count) : this.doc.lines[v2d[i]];
      }
      this.viewText = parts.join('\n');
      this._viewDirtyFrom = 0;
    }

    _viewStartsEnsure() {
      if (this._viewDirtyFrom === Infinity) return;
      const v2d = this.viewToDoc;
      const starts = this._viewStarts;
      let off = this._viewDirtyFrom === 0 ? 0 : starts[this._viewDirtyFrom];
      for (let i = this._viewDirtyFrom, n = v2d.length; i < n; i++) {
        starts[i] = off;
        const f = this.foldAtView.get(i);
        off += (f ? PLACEHOLDER(f.count).length : this.doc.lines[v2d[i]].length) + 1;
      }
      starts.length = v2d.length;
      this._viewDirtyFrom = Infinity;
    }

    /* --------------------------------------------------------- 坐标换算 */
    /** 视图字符偏移 → {line, col}（文档坐标） */
    viewOffsetToDoc(vOff) {
      if (!this.hasFolds) {
        const p = this.doc.positionAt(vOff);
        return { line: p.line, col: p.col, fold: null };
      }
      this._viewStartsEnsure();
      const vl = Math.max(0, U.lowerBound(this._viewStarts, vOff));
      const col = vOff - this._viewStarts[vl];
      const f = this.foldAtView.get(vl);
      if (f) return { line: f.startLine, col: this.doc.lines[f.startLine].length, fold: f, viewLine: vl };
      const dl = this.viewToDoc[vl];
      return { line: dl, col: Math.min(col, this.doc.lines[dl].length), fold: null, viewLine: vl };
    }

    /** 文档字符偏移 → 视图字符偏移 */
    docToViewOffset(docOff) {
      if (!this.hasFolds) return docOff;
      const pos = this.doc.positionAt(docOff);
      const vl = this.viewLineOf(pos.line);
      this._viewStartsEnsure();
      const f = this.foldAtView.get(vl);
      const maxCol = f ? this.doc.lines[f.startLine].length : this.doc.lines[this.viewToDoc[vl]].length;
      return this._viewStarts[vl] + Math.min(pos.col, maxCol);
    }

    /* ------------------------------------------------------------ 输入处理 */
    _onInput() {
      if (this.composing || !this.doc) return;
      const newText = this.input.value;
      const oldText = this.viewText;
      if (newText === oldText) return;

      const d = U.diffRange(oldText, newText);
      const inserted = newText.slice(d.start, d.newEnd);

      const startPos = this.viewOffsetToDoc(d.start);
      const endPos = this.viewOffsetToDoc(d.oldEnd);

      // 编辑落到折叠占位行上：先展开再重建，绝不把占位符写进文档
      if (startPos.fold || endPos.fold) {
        this._unfoldViewLines(startPos, endPos);
        return;
      }

      const docStart = this.doc.offsetAt(startPos.line, startPos.col);
      const docEnd = this.doc.offsetAt(endPos.line, endPos.col);
      const insertedLineCount = inserted.split('\n').length;

      // 视图文本与文档文本保持同步（textarea.value 已是新值，这里只同步缓存）
      this.viewText = newText;

      this.doc.replaceRange(docStart, docEnd, inserted, {
        undo: 'type',
        sel: { anchor: docStart, head: docStart + inserted.length }
      });

      // 分词缓存失效：只清受影响的行后缀
      this._invalidateFrom(startPos.line);

      // 视图映射维护。
      // 折叠区之后发生的编辑：折叠区的行号不受影响，可以增量更新映射（O(1)）。
      // 折叠区之前（或之内）发生的编辑：折叠区的行号会整体平移，且折叠结构本身
      // 可能变化，此时做一次完整重建（O(n)，但只在"有折叠且在上方编辑"时发生）。
      if (this.hasFolds) {
        let maxFoldStart = -1;
        for (const s of this.foldModel.collapsed) if (s > maxFoldStart) maxFoldStart = s;
        if (startPos.line <= maxFoldStart) {
          this._fullResync();
          return;
        }
        const vStart = startPos.viewLine;
        const vEnd = endPos.viewLine;
        const newLines = [];
        for (let i = 0; i < insertedLineCount; i++) newLines.push(startPos.line + i);
        this.viewToDoc.splice(vStart, vEnd - vStart + 1, ...newLines);
        for (const k of Array.from(this.foldAtView.keys())) {
          if (k >= vStart) this.foldAtView.delete(k);
        }
        this._viewDirtyFrom = Math.min(this._viewDirtyFrom, vStart);
      }

      NT.bus.emit('view:input', {
        doc: this.doc,
        change: { start: docStart, end: docEnd, text: inserted }
      });
      this.render();
    }

    /** 折叠占位行被编辑：展开相关折叠后整体重建（低频路径，允许 O(n)） */
    _unfoldViewLines(a, b) {
      const fm = this.foldModel;
      if (fm) {
        if (a.fold) fm.collapsed.delete(a.fold.startLine);
        if (b.fold) fm.collapsed.delete(b.fold.startLine);
        fm._rebuildRanges();
      }
      this._fullResync();
    }

    /** 文档内容被外部修改（撤销/宏/替换/插件）后，整体重建视图 */
    _fullResync() {
      const doc = this.doc;
      this.foldModel = this.lightweight ? null : NT.folds.ensure(doc);
      this._rebuildViewMap();
      this._rebuildViewText();
      const sel = { anchor: this.docToViewOffset(doc.sel.anchor), head: this.docToViewOffset(doc.sel.head) };
      this.input.value = this.viewText;
      this.input.setSelectionRange(sel.anchor, sel.head);
      this._updateGutterWidth();
      this.render(true);
    }

    _invalidateFrom(line) {
      for (const k of Array.from(this.tokenCache.keys())) if (k >= line) this.tokenCache.delete(k);
      this.lineStates.length = Math.min(this.lineStates.length, line);
      this._maxStateIndex = Math.min(this._maxStateIndex, line - 1);
    }

    /* ------------------------------------------------------------ 分词与着色 */
    _stateAt(dl) {
      if (dl <= 0) return NT.languages.INITIAL;
      if (dl - 1 <= this._maxStateIndex) return this.lineStates[dl - 1] || NT.languages.INITIAL;
      const start = this._maxStateIndex + 1;
      if (dl - start > CATCHUP) {
        // 跳转距离过远：放弃精确状态，避免一次性补算几万行
        this.lineStates[dl - 1] = NT.languages.INITIAL;
        this._maxStateIndex = dl - 1;
        return NT.languages.INITIAL;
      }
      const lang = NT.languages.get(this.doc.language);
      let st = start === 0 ? NT.languages.INITIAL : (this.lineStates[start - 1] || NT.languages.INITIAL);
      for (let k = start; k < dl; k++) {
        st = NT.languages.tokenize(lang, this.doc.lines[k], st).state;
        this.lineStates[k] = st;
      }
      this._maxStateIndex = dl - 1;
      return st;
    }

    _tokensFor(dl) {
      const hit = this.tokenCache.get(dl);
      if (hit) return hit;
      const doc = this.doc;
      const line = doc.lines[dl] === undefined ? '' : doc.lines[dl];
      const lang = NT.languages.get(doc.language);
      let out;
      if (this.lightweight || !lang._rules || !lang._rules.length) {
        out = { tokens: line ? [{ s: 0, e: line.length, t: 'var' }] : [], state: NT.languages.INITIAL };
      } else {
        const res = NT.languages.tokenize(lang, line, this._stateAt(dl));
        out = { tokens: res.tokens, state: res.state };
        this.lineStates[dl] = res.state;
        if (dl > this._maxStateIndex) this._maxStateIndex = dl;
      }
      // 缓存上限，防止超长文档把内存吃满
      if (this.tokenCache.size > 6000) this.tokenCache.clear();
      this.tokenCache.set(dl, out);
      return out;
    }

    /** 把一行渲染成 HTML：分词区间 ∪ 装饰区间 求并集后逐段输出 */
    _renderLineHtml(dl, line) {
      const tokens = this._tokensFor(dl).tokens;
      const decs = this._decorationsFor(dl, line);

      if (!decs.length) {
        let html = '';
        let pos = 0;
        for (const tk of tokens) {
          if (tk.s > pos) html += U.esc(line.slice(pos, tk.s));
          const cls = NT.languages.className(tk.t);
          const txt = U.esc(line.slice(tk.s, tk.e));
          html += cls ? '<span class="' + cls + '">' + txt + '</span>' : txt;
          pos = tk.e;
        }
        if (pos < line.length) html += U.esc(line.slice(pos));
        return html;
      }

      // 有装饰：按所有边界切段
      const bounds = [0, line.length];
      for (const tk of tokens) { bounds.push(tk.s, tk.e); }
      for (const d of decs) { bounds.push(d.s, d.e); }
      bounds.sort((a, b) => a - b);
      let html = '';
      let ti = 0;
      for (let i = 0; i < bounds.length - 1; i++) {
        const s = bounds[i], e = bounds[i + 1];
        if (e <= s) continue;
        while (ti < tokens.length && tokens[ti].e <= s) ti++;
        const tk = tokens[ti];
        const cls = (tk && tk.s <= s && tk.e >= e) ? NT.languages.className(tk.t) : '';
        let dcls = '';
        for (const d of decs) if (d.s <= s && d.e >= e) dcls += ' ' + d.cls;
        const all = (cls + dcls).trim();
        const txt = U.esc(line.slice(s, e));
