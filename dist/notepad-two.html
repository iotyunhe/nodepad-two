        html += all ? '<span class="' + all + '">' + txt + '</span>' : txt;
      }
      return html;
    }

    _decorationsFor(dl, line) {
      let out = null;
      const ms = this._matchByLine.get(dl);
      if (ms) {
        out = [];
        for (const m of ms) {
          out.push({ s: m.col, e: m.col + Math.max(1, m.len), cls: m.active ? 'dec-match-active' : 'dec-match' });
        }
      }
      for (const fn of this.decorators) {
        let r;
        try { r = fn(dl, line, this); } catch (e) { r = null; }
        if (r && r.length) out = out ? out.concat(r) : r;
      }
      return out || [];
    }

    /* ------------------------------------------------------------ 渲染 */
    scheduleRender() {
      if (this._rafPending) return;
      this._rafPending = true;
      requestAnimationFrame(() => { this._rafPending = false; this.render(); });
    }

    render(force) {
      if (!this.doc) return;
      const lh = this.metrics.lh;
      const st = this.input.scrollTop, sl = this.input.scrollLeft;
      const total = this.viewLineCount;
      const viewH = this.scroll.clientHeight;

      let first = Math.floor((st - this.metrics.padTop) / lh) - OVERSCAN;
      first = U.clamp(first, 0, Math.max(0, total - 1));
      let last = Math.min(total, first + Math.ceil(viewH / lh) + OVERSCAN * 2 + 2);

      const dirty = force || first !== this._lastRender.first || last !== this._lastRender.last ||
        this._lastRender.version !== this.doc.version || this._lastRender.scroll !== st;
      if (!dirty) return;
      this._lastRender = { first, last, version: this.doc.version, scroll: st };

      /* ---- 高亮层（只渲染可见行） ---- */
      const rows = new Array(last - first);
      for (let v = first; v < last; v++) {
        const f = this.foldAtView.get(v);
        if (f) {
          rows[v - first] = '<span class="row"><span class="nt-fold-ph">' + U.esc(PLACEHOLDER(f.count)) + '</span></span>';
        } else {
          const dl = this.docLineOf(v);
          const line = this.doc.lines[dl] === undefined ? '' : this.doc.lines[dl];
          rows[v - first] = '<span class="row">' + this._renderLineHtml(dl, line) + '</span>';
        }
      }
      this.hlCode.innerHTML = rows.join('');
      this.hlCode.style.transform = 'translateY(' + (first * lh - st) + 'px)';
      this.hl.style.transform = 'translateX(' + (-sl) + 'px)';

      /* ---- 行号槽 ---- */
      this._renderGutter(first, last, st);

      /* ---- 当前行底色 ---- */
      const sel = this.doc.selRange();
      const caretPos = this.doc.positionAt(sel.head);
      const cvl = this.viewLineOf(caretPos.line);
      const visible = cvl >= first - 1 && cvl <= last;
      this.curLine.style.display = visible ? 'block' : 'none';
      this.curLine.style.transform = 'translateY(' + (this.metrics.padTop + cvl * lh - st) + 'px)';

      this._lastRender.first = first;
      this._lastRender.last = last;
      NT.bus.emit('view:render', { doc: this.doc, first, last });
    }

    _renderGutter(first, last, st) {
      const parts = new Array(last - first);
      const fm = this.foldModel;
      const collapsed = fm ? fm.collapsed : null;
      const sel = this.doc.selRange();
      const from = this.doc.positionAt(sel.start).line;
      const to = this.doc.positionAt(sel.end).line;

      for (let v = first; v < last; v++) {
        const dl = this.docLineOf(v);
        const placeholder = this.foldAtView.get(v);
        if (placeholder) {
          // 占位行：不给行号（避免与折叠起始行重复），只显示折叠标记
          parts[v - first] =
            '<div class="nt-ln folded" data-line="' + dl + '">' +
            '<span class="ln-fold has" title="展开">▶</span>' +
            '<span class="ln-num" style="color:var(--fg-faint)">⋯</span></div>';
          continue;
        }
        const isFoldStart = !!(fm && fm.hasFold(dl));
        const isCollapsed = !!(collapsed && collapsed.has(dl));
        const active = (dl >= from && dl <= to);
        const fold = isFoldStart
          ? '<span class="ln-fold has" title="' + (isCollapsed ? '展开' : '折叠') + '">' +
            (isCollapsed ? '▶' : '▼') + '</span>'
          : '<span class="ln-fold"></span>';
        parts[v - first] =
          '<div class="nt-ln' + (active ? ' active' : '') + (isCollapsed ? ' folded' : '') +
          '" data-line="' + dl + '">' + fold +
          '<span class="ln-num">' + (dl + 1) + '</span></div>';
      }
      this.gutterInner.innerHTML = parts.join('');
      this.gutterInner.style.transform = 'translateY(' + (this.metrics.padTop + first * this.metrics.lh - st) + 'px)';
    }

    _updateGutterWidth() {
      const total = this.doc ? this.doc.lines.length : 1;
      this.metrics.digits = String(total).length;
      this.gutter.style.minWidth = (this.metrics.digits * 8 + 34) + 'px';
    }

    /* ------------------------------------------------------------ 选区同步 */
    _syncSelection() {
      if (!this.doc || this.composing) return;
      const a = this.input.selectionStart, b = this.input.selectionEnd;
      if (this.hasFolds) {
        const pa = this.viewOffsetToDoc(a), pb = this.viewOffsetToDoc(b);
        this.doc.sel.anchor = this.doc.offsetAt(pa.line, pa.col);
        this.doc.sel.head = this.doc.offsetAt(pb.line, pb.col);
      } else {
        this.doc.sel.anchor = a;
        this.doc.sel.head = b;
      }
      this._lastRender.version = -1;   // 强制重绘当前行/行号高亮
      this.render();
      NT.bus.emit('view:selection', { doc: this.doc, sel: this.doc.selRange() });
    }

    setSelFromDoc(anchor, head) {
      if (!this.doc) return;
      const r = anchor === undefined
        ? this.doc.selRange()
        : { start: Math.min(anchor, head), end: Math.max(anchor, head) };
      const va = this.docToViewOffset(r.start), vb = this.docToViewOffset(r.end);
      this.input.setSelectionRange(va, vb);
      this._lastRender.version = -1;
      this.render();
    }

    /* -------------------------------------------------------- 光标与滚动 */
    /** 光标所在的行/列（文档坐标） */
    get caret() {
      const p = this.doc.positionAt(this.doc.sel.head);
      return { line: p.line, col: p.col };
    }

    /** 保证光标可见（必要时滚动） */
    revealCaret() {
      const p = this.caret;
      const vl = this.viewLineOf(p.line);
      const lh = this.metrics.lh;
      const top = this.metrics.padTop + vl * lh;
      const bottom = top + lh;
      const vh = this.scroll.clientHeight;
      const st = this.input.scrollTop;
      if (top - this.metrics.padTop < st) this.input.scrollTop = Math.max(0, top - this.metrics.padTop - lh * 2);
      else if (bottom > st + vh) this.input.scrollTop = bottom - vh + lh * 2;

      const x = this.metrics.padLeft + p.col * this.metrics.cw;
      const vw = this.scroll.clientWidth;
      const sl = this.input.scrollLeft;
      if (x < sl) this.input.scrollLeft = Math.max(0, x - 40);
      else if (x > sl + vw - 20) this.input.scrollLeft = x - vw + 60;
      this.scheduleRender();
    }

    scrollToLine(line, center) {
      const vl = this.viewLineOf(U.clamp(line, 0, this.doc.lines.length - 1));
      const lh = this.metrics.lh;
      if (center) {
        this.input.scrollTop = Math.max(0, this.metrics.padTop + vl * lh - this.scroll.clientHeight / 2);
      } else {
        const top = this.metrics.padTop + vl * lh;
        const vh = this.scroll.clientHeight;
        if (top < this.input.scrollTop || top > this.input.scrollTop + vh - lh) {
          this.input.scrollTop = Math.max(0, top - vh / 2);
        }
      }
      this.scheduleRender();
    }

    /** 把光标移到文档偏移处（并可选设置选区） */
    setCaret(docOffset, extend) {
      if (extend) this.doc.sel.head = docOffset;
      else { this.doc.sel.anchor = docOffset; this.doc.sel.head = docOffset; }
      this.setSelFromDoc();
      this.revealCaret();
    }

    /* ------------------------------------------------------------ 折叠操作 */
    toggleFold(line) {
      if (!this.foldModel) this.foldModel = NT.folds.ensure(this.doc);
      if (!this.foldModel.toggle(line)) return false;
      this._fullResync();
      NT.bus.emit('fold:toggle', { doc: this.doc, line, collapsed: this.foldModel.isCollapsed(line) });
      return true;
    }
    foldAll() {
      if (!this.foldModel) this.foldModel = NT.folds.ensure(this.doc);
      this.foldModel.collapseAll();
      this._fullResync();
    }
    unfoldAll() {
      if (!this.foldModel) this.foldModel = NT.folds.ensure(this.doc);
      this.foldModel.expandAll();
      this._fullResync();
    }
    foldLevel(n) {
      if (!this.foldModel) this.foldModel = NT.folds.ensure(this.doc);
      this.foldModel.collapseLevel(n);
      this._fullResync();
    }

    /* ------------------------------------------------------------ 搜索高亮 */
    setSearchMatches(matches, activeIndex) {
      this.searchMatches = matches || [];
      this.activeMatchIndex = activeIndex === undefined ? -1 : activeIndex;
      this._matchByLine.clear();
      for (let i = 0; i < this.searchMatches.length; i++) {
        const m = this.searchMatches[i];
        let arr = this._matchByLine.get(m.line);
        if (!arr) { arr = []; this._matchByLine.set(m.line, arr); }
        arr.push({ col: m.col, len: m.end - m.start, active: i === this.activeMatchIndex });
      }
      this._lastRender.version = -1;
      this.render(true);
    }
    clearSearchMatches() {
      this.searchMatches = [];
      this._matchByLine.clear();
      this.activeMatchIndex = -1;
      this.render(true);
    }

    /** 注册装饰器（插件用），返回注销函数 */
    addDecorator(fn) {
      this.decorators.push(fn);
      this.render(true);
      return () => {
        const i = this.decorators.indexOf(fn);
        if (i >= 0) this.decorators.splice(i, 1);
        this.render(true);
      };
    }

    /* -------------------------------------------------------- 屏幕坐标换算 */
    /** 文档偏移 → 相对 .nt-editor 的像素坐标（补全弹窗定位用） */
    pointAt(docOffset) {
      const pos = this.doc.positionAt(docOffset);
      const vl = this.viewLineOf(pos.line);
      return {
        x: this.gutter.offsetWidth + this.metrics.padLeft + pos.col * this.metrics.cw - this.input.scrollLeft,
        y: this.metrics.padTop + (vl + 1) * this.metrics.lh - this.input.scrollTop,
        line: pos.line, col: pos.col
      };
    }

    /* ------------------------------------------------------------ 编辑命令 */
    /**
     * 用文本替换当前选区（所有"插入文本"类操作都走这里）。
     * 返回插入后的偏移。
     */
    insertText(text, opt) {
      opt = opt || {};
      const r = this.doc.selRange();
      const ch = this.doc.replaceRange(r.start, r.end, text, { undo: opt.undo || 'type' });
      if (!ch) return r.start;
      this._invalidateFrom(this.doc.positionAt(r.start).line);
      this._afterExternalEdit();
      return r.start + text.length;
    }

    /** 外部编辑（命令/宏/插件）后统一走这里同步视图 */
    _afterExternalEdit() {
      this._lastRender.version = -1;
      if (this.hasFolds) this._fullResync();
      else {
        this.viewText = this.doc.getText();
        this.input.value = this.viewText;
        this.setSelFromDoc();
        this._updateGutterWidth();
        this.render(true);
      }
      this.revealCaret();
    }

    /* -------------------------------------------------------- 键盘特殊处理 */
    _onKeyDown(e) {
      if (this.ac && this.ac.handleKey(e)) { e.preventDefault(); return; }

      const mod = e.ctrlKey || e.metaKey;

      // 先给应用层/插件层的快捷键
      if (this.app && this.app.handleKey(e)) { e.preventDefault(); return; }

      const s = this.app ? this.app.settings : { tabSize: 4, autoIndent: true, autoClose: true };

      /* Tab / Shift+Tab：多行缩进或插入制表符 */
      if (e.key === 'Tab' && !mod && !e.altKey) {
        e.preventDefault();
        this._handleTab(e.shiftKey);
        return;
      }

      /* Enter：自动缩进 */
      if (e.key === 'Enter' && !mod && s.autoIndent !== false) {
        e.preventDefault();
        this._handleEnter();
        return;
      }

      /* Backspace：删除成对括号 / 删除一级缩进 */
      if (e.key === 'Backspace' && !mod) {
        if (this._handleSmartBackspace()) { e.preventDefault(); return; }
      }

      /* 自动配对 */
      if (s.autoClose !== false && e.key.length === 1 && !mod && !e.ctrlKey && !e.altKey) {
        if (this._handleAutoPair(e.key, e)) { e.preventDefault(); return; }
      }
    }

    _indentUnit() {
      const s = this.app ? this.app.settings : {};
      const size = s.tabSize || 4;
      return s.insertSpaces === false ? '\t' : ' '.repeat(size);
    }

    _handleTab(shift) {
      const doc = this.doc;
      const sel = doc.selRange();
      const a = doc.positionAt(sel.start), b = doc.positionAt(sel.end);
      const multiLine = a.line !== b.line;
      const unit = this._indentUnit();

      if (!multiLine && !shift) {
        this.insertText(unit);
        this.setSelFromDoc(doc.sel.head, doc.sel.head);
        return;
      }
      const from = a.line, to = b.line;
      doc.beginBatch(shift ? '取消缩进' : '缩进');
      try {
        for (let l = to; l >= from; l--) {
          const text = doc.lines[l];
          if (shift) {
            const m = /^(\t| {1,8})/.exec(text);
            if (m) {
              const cut = m[1][0] === '\t' ? 1 : Math.min(m[1].length, (this.app.settings.tabSize || 4));
              doc.remove(doc.offsetAt(l, 0), doc.offsetAt(l, cut), { undo: null });
            }
          } else {
            doc.insert(doc.offsetAt(l, 0), unit, { undo: null });
          }
        }
      } finally { doc.endBatch(); }
      this._invalidateFrom(from);
      const newStart = doc.offsetAt(from, 0);
      const newEnd = doc.lineEndOffset(to);
      this._afterExternalEdit();
      this.setSelFromDoc(newStart, newEnd);
    }

    _handleEnter() {
      const doc = this.doc;
      const sel = doc.selRange();
      const p = doc.positionAt(sel.start);
      const line = doc.lineAt(p.line);
      const before = line.slice(0, p.col);
      const indent = (/^[ \t]*/.exec(before) || [''])[0];
      const unit = this._indentUnit();
      const trimmed = before.replace(/[ \t]+$/, '');
      const opens = /[{[(]$/.test(trimmed);
      const closes = /^[}\]):]/.test(line.slice(p.col).replace(/^[ \t]+/, ''));

      let text = '\n' + indent;
      let caretBack = 0;
      if (opens) {
        text += unit;
        if (closes) { text += '\n' + indent; caretBack = indent.length + 1; }
      }
      this.insertText(text);
      const after = doc.sel.head - caretBack;
      doc.setSel(after, after);
      this.setSelFromDoc();
      this.revealCaret();
    }

    _handleSmartBackspace() {
      const doc = this.doc;
      const sel = doc.selRange();
      if (sel.start !== sel.end) return false;

      // 成对符号：() [] {} "" '' `` → 一次删掉两个
      if (sel.start > 0 && sel.start < doc.length) {
        const before = doc.getRange(sel.start - 1, sel.start);
        const after = doc.getRange(sel.start, sel.start + 1);
        const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
        if (PAIRS[before] && PAIRS[before] === after) {
          doc.remove(sel.start - 1, sel.start + 1, { undo: 'delete' });
          this._afterExternalEdit();
          return true;
        }
      }

      // 行首缩进：一次删除一级
      const p = doc.positionAt(sel.start);
      const line = doc.lineAt(p.line);
      const beforeText = line.slice(0, p.col);
      if (p.col > 0 && /^[ \t]+$/.test(beforeText)) {
        const unit = this._indentUnit();
        const n = Math.min(unit.length, p.col);
        doc.remove(sel.start - n, sel.start, { undo: 'delete' });
        this._afterExternalEdit();
        return true;
      }
      return false;
    }

    _handleAutoPair(key, e) {
      const CLOSERS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
      const SKIP_ONLY = { ')': 1, ']': 1, '}': 1 };   // 只做"跳过"，不做"插入"

      const doc = this.doc;
      const sel = doc.selRange();

      // 输入闭合符时，若右侧紧邻同一个闭合符（多半是自动配对留下的），
      // 光标直接跳过它，而不是插成 "))" —— 这是编辑器的通用手感
      if (SKIP_ONLY[key]) {
        if (sel.start !== sel.end) return false;
        const nextCh = sel.end < doc.length ? doc.getRange(sel.end, sel.end + 1) : '';
        if (nextCh === key) {
          doc.setSel(sel.end + 1, sel.end + 1);
          this.setSelFromDoc();
          return true;
        }
        return false;
      }

      const closer = CLOSERS[key];
      if (!closer) return false;

      const nextCh = sel.end < doc.length ? doc.getRange(sel.end, sel.end + 1) : '';
      const prevCh = sel.start > 0 ? doc.getRange(sel.start - 1, sel.start) : '';

      // 引号：前一个字符是单词字符时不自动补全（避免英文撇号被打断）
      if ((key === '"' || key === "'" || key === '`') && U.isWordChar(prevCh)) return false;

      if (sel.start !== sel.end) {
        // 有选区：包裹
        const text = doc.getRange(sel.start, sel.end);
        doc.replaceRange(sel.start, sel.end, key + text + closer, {
          undo: 'type', sel: { anchor: sel.start + 1, head: sel.start + 1 + text.length }
        });
        this._afterExternalEdit();
        return true;
      }
      if (nextCh === closer) {
        // 已经存在闭合符：光标右移而不是再插一个
        doc.setSel(sel.end + 1, sel.end + 1);
        this.setSelFromDoc();
        return true;
      }
      this.insertText(key + closer);
      const p = doc.sel.head - 1;
      doc.setSel(p, p);
      this.setSelFromDoc();
      return true;
    }

    /* ------------------------------------------------------------ 只读装饰 */
    setLightweight(on) {
      if (this.lightweight === on) return;
      this.lightweight = on;
      this._resetCaches();
      this._fullResync();
    }
  }

  NT.EditorView = EditorView;
  NT.EditorView.PLACEHOLDER = PLACEHOLDER;
  NT.EditorView.OVERSCAN = OVERSCAN;

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== src/50-completion.js ==== */
/* ============================================================================
 * 50-completion.js — 自动补全
 *
 * 架构：Controller + 多 Provider 聚合
 *   Provider 是一个纯函数 (ctx) => Item[]，ctx 里带着当前语言、已输入前缀、
 *   光标前的文本窗口。任何模块（含插件）都可以注册 Provider，控制器只负责
 *   聚合、排序、截断与弹窗交互。
 *
 * 三个内置 Provider：
 *   1) 语言关键字/内置类型  —— 来自 20-languages.js 的语言定义
 *   2) 文档词（Document Words）—— 从当前文档提取的标识符，按词频排序
 *   3) 片段（Snippets）—— 少量常用代码骨架
 *
 * 性能：文档词表按 doc.version 惰性重建并做 300ms 防抖；超大文档只扫描
 * 光标附近的窗口（±600 行），避免为了一次补全遍历 20 万行。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});
  const U = NT.util;

  const MAX_ITEMS = 60;
  const DOC_WORD_WINDOW = 600;      // 大文档时扫描的上下文行数
  const DOC_WORD_SCAN_LIMIT = 400000; // 小文档全量扫描的字符上限

  /* ------------------------------------------------------------ Provider：关键字 */
  function keywordProvider(ctx) {
    const lang = NT.languages.get(ctx.language);
    const out = [];
    const push = (type, kind) => {
      for (const w of NT.languages.words(lang, type)) {
        out.push({ label: w, kind, detail: lang.name, insert: w });
      }
    };
    push('keyword', '关键字');
    push('type', '类型');
    push('builtin', '内置');
    return out;
  }

  /* ------------------------------------------------------- Provider：文档词 */
  const docWordCache = new WeakMap();   // doc -> {version, words}

  function collectDocWords(doc, caretLine, lightweight) {
    const cached = docWordCache.get(doc);
    if (cached && cached.version === doc.version) return cached.words;

    const freq = new Map();
    const lines = doc.lines;
    let from = 0, to = lines.length;
    const totalChars = doc.length;

    if (totalChars > DOC_WORD_SCAN_LIMIT) {
      from = Math.max(0, caretLine - DOC_WORD_WINDOW);
      to = Math.min(lines.length, caretLine + DOC_WORD_WINDOW);
    }
    const RE = /[A-Za-z_$][A-Za-z0-9_$]{1,}/g;
    for (let i = from; i < to; i++) {
      const line = lines[i];
      if (line.length > 4000) continue;
      let m;
      RE.lastIndex = 0;
      while ((m = RE.exec(line)) !== null) {
        const w = m[0];
        if (w.length < 2) continue;
        freq.set(w, (freq.get(w) || 0) + 1);
      }
    }
    const words = Array.from(freq.entries())
      .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
      .slice(0, 3000)
      .map(([w, c]) => ({ label: w, kind: '词', detail: '×' + c, insert: w, _freq: c }));
    const rec = { version: doc.version, words };
    docWordCache.set(doc, rec);
    return words;
  }

  function documentWordProvider(ctx) {
    if (ctx.lightweight) return [];
    return collectDocWords(ctx.doc, ctx.line, ctx.lightweight);
  }

  /* ---------------------------------------------------------- Provider：片段 */
  const SNIPPETS = {
    javascript: [
      { label: 'forof', insert: 'for (const ${1:item} of ${2:items}) {\n\t$0\n}', detail: 'for...of 循环' },
      { label: 'fori', insert: 'for (let i = 0; i < ${1:n}; i++) {\n\t$0\n}', detail: '计数循环' },
      { label: 'fn', insert: 'function ${1:name}(${2}) {\n\t$0\n}', detail: '函数声明' },
      { label: 'afn', insert: 'const ${1:name} = (${2}) => {\n\t$0\n};', detail: '箭头函数' },
      { label: 'tryc', insert: 'try {\n\t$1\n} catch (err) {\n\t$0\n}', detail: 'try/catch' },
      { label: 'clog', insert: 'console.log($0);', detail: '打印日志' },
      { label: 'prom', insert: 'new Promise((resolve, reject) => {\n\t$0\n});', detail: 'Promise' }
    ],
    python: [
      { label: 'def', insert: 'def ${1:name}(${2}):\n\t$0', detail: '函数定义' },
      { label: 'class', insert: 'class ${1:Name}:\n\tdef __init__(self${2}):\n\t\t$0', detail: '类定义' },
      { label: 'ifmain', insert: 'if __name__ == "__main__":\n\t$0', detail: '入口判断' },
      { label: 'trye', insert: 'try:\n\t$1\nexcept ${2:Exception} as e:\n\t$0', detail: '异常处理' }
    ],
    html: [
      { label: 'html5', insert: '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n\t<meta charset="utf-8">\n\t<title>$1</title>\n</head>\n<body>\n\t$0\n</body>\n</html>', detail: 'HTML5 骨架' }
    ],
    markdown: [
      { label: 'table', insert: '| 列1 | 列2 |\n| --- | --- |\n| $1 | $2 |', detail: '表格' },
      { label: 'code', insert: '```${1:js}\n$0\n```', detail: '代码块' }
    ]
  };

  function snippetProvider(ctx) {
    const list = SNIPPETS[ctx.language];
    if (!list) return [];
    return list.map((s) => ({ label: s.label, kind: '片段', detail: s.detail, insert: s.insert, snippet: true }));
  }

  /* ------------------------------------------------------------ 控制器 */
  class CompletionController {
    constructor(view) {
      this.view = view;
      this.providers = [keywordProvider, snippetProvider, documentWordProvider];
      this.items = [];
      this.filtered = [];
      this.index = 0;
      this.visible = false;
      this.range = null;
      this.el = null;
      this._explicit = false;

      NT.bus.on('view:input', (p) => { if (p.doc === view.doc) this.onInput(); });
      NT.bus.on('view:selection', (p) => {
        if (p.doc === view.doc && this.visible && !this._suppress) this.hide();
      });
      view.input.addEventListener('blur', () => setTimeout(() => this.hide(), 120));
    }

    register(fn) { this.providers.push(fn); return () => {
      const i = this.providers.indexOf(fn); if (i >= 0) this.providers.splice(i, 1);
    }; }

    /* ------------------------------------------------------- 触发与过滤 */
    onInput() {
      const doc = this.view.doc;
      if (!doc) return;
      if (this.view.lightweight) { this.hide(); return; }
      const caret = doc.sel.head;
      const word = this._wordAt(caret);
      if (!word || word.text.length < 1) { this.hide(); return; }
      this._explicit = false;
      this.range = { start: word.start, end: caret };
      this._populate(word.text);
    }

    trigger(explicit) {
      const doc = this.view.doc;
      if (!doc) return;
      const caret = doc.sel.head;
      const word = this._wordAt(caret);
      this._explicit = true;
      this.range = { start: word ? word.start : caret, end: caret };
      this._populate(word ? word.text : '');
    }

    _wordAt(caret) {
      const doc = this.view.doc;
      let start = caret;
      while (start > 0) {
        const ch = doc.getRange(start - 1, start);
        if (!U.isWordChar(ch)) break;
        start--;
      }
      if (start === caret && !this._explicit) return null;
      return { start, text: doc.getRange(start, caret) };
    }

    _populate(prefix) {
      const doc = this.view.doc;
      const pos = doc.positionAt(this.range.start);
      const ctx = {
        doc, language: doc.language, line: pos.line, prefix,
        lightweight: this.view.lightweight, view: this.view, explicit: this._explicit
      };
      let items = [];
      for (const p of this.providers) {
        try {
          const r = p(ctx);
          if (r && r.length) items = items.concat(r);
        } catch (e) { console.error('[Completion] Provider 异常', e); }
      }

      // 去重（label 相同者保留第一个）
      const seen = new Set();
      const uniq = [];
      for (const it of items) {
        if (seen.has(it.label)) continue;
        seen.add(it.label);
        uniq.push(it);
      }

      const lower = prefix.toLowerCase();
      let cands = uniq.filter((it) => it.label.toLowerCase().startsWith(lower) && it.label !== prefix);
      if (!cands.length && this._explicit) {
        cands = uniq.filter((it) => it.label.toLowerCase().includes(lower) && it.label !== prefix);
      }
      // 排序：前缀命中优先 → 类型权重 → 文档词频 → 字典序
      const KIND_W = { '片段': 0, '关键字': 1, '内置': 2, '词': 3 };
      cands.sort((a, b) =>
        (KIND_W[a.kind] === undefined ? 9 : KIND_W[a.kind]) - (KIND_W[b.kind] === undefined ? 9 : KIND_W[b.kind]) ||
        (b._freq || 0) - (a._freq || 0) ||
        a.label.length - b.label.length ||
        a.label.localeCompare(b.label));

      this.items = cands.slice(0, MAX_ITEMS);
      if (!this.items.length) { this.hide(); return; }
      this.index = 0;
      this.show();
    }

    /* ------------------------------------------------------------ 弹窗 */
    show() {
      if (!this.el) {
        this.el = document.createElement('div');
        this.el.className = 'nt-ac';
        this.el.addEventListener('mousedown', (e) => {
          const item = e.target.closest && e.target.closest('.nt-ac-item');
          if (!item) return;
          e.preventDefault();
          this.index = parseInt(item.dataset.idx, 10);
          this.accept();
        });
        this.view.el.appendChild(this.el);
      }
      this.el.innerHTML = this.items.map((it, i) =>
        '<div class="nt-ac-item' + (i === this.index ? ' sel' : '') + '" data-idx="' + i + '">' +
        '<span class="ac-kind">' + U.esc(it.kind) + '</span>' +
        '<span class="ac-label">' + U.esc(it.label) + '</span>' +
        (it.detail ? '<span class="ac-detail">' + U.esc(it.detail) + '</span>' : '') +
        '</div>').join('');
      this.el.hidden = false;
      this.visible = true;
      this._position();
    }

    _position() {
      const p = this.view.pointAt(this.range.start);
      const maxH = 216;
      const editorH = this.view.el.clientHeight;
      let y = p.y;
      if (y + maxH > editorH - 8) y = Math.max(4, p.y - maxH - this.view.metrics.lh - 4);
      this.el.style.left = Math.max(4, Math.min(p.x, this.view.el.clientWidth - 240)) + 'px';
      this.el.style.top = y + 'px';
    }

    hide() {
      if (this.el) this.el.hidden = true;
      this.visible = false;
      this.items = [];
    }

    _scrollIntoView() {
      const sel = this.el.querySelector('.nt-ac-item.sel');
      if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
    }

    /* ------------------------------------------------------------ 交互 */
    handleKey(e) {
      if (!this.visible) return false;
      switch (e.key) {
        case 'ArrowDown':
          this.index = (this.index + 1) % this.items.length;
          this._refreshSel(); return true;
        case 'ArrowUp':
          this.index = (this.index - 1 + this.items.length) % this.items.length;
          this._refreshSel(); return true;
        case 'PageDown':
          this.index = Math.min(this.items.length - 1, this.index + 8); this._refreshSel(); return true;
        case 'PageUp':
          this.index = Math.max(0, this.index - 8); this._refreshSel(); return true;
        case 'Enter':
        case 'Tab':
          this.accept(); return true;
        case 'Escape':
          this.hide(); return true;
        default:
          if (e.key.length === 1 || e.key === 'Backspace') { this.hide(); return false; }
          return false;
      }
    }

    _refreshSel() {
      const nodes = this.el.querySelectorAll('.nt-ac-item');
      nodes.forEach((n, i) => n.classList.toggle('sel', i === this.index));
      this._scrollIntoView();
    }

    accept() {
      const it = this.items[this.index];
      if (!it) { this.hide(); return; }
      const doc = this.view.doc;
      const r = doc.selRange();
      const start = this.range.start;

      let text = it.insert, caret = -1;
      if (it.snippet) {
        const built = this._snippetToText(it.insert);
        text = built.text;
        caret = built.caret;
      }
      doc.replaceRange(start, r.end, text, { undo: 'type' });
      if (caret >= 0) {
        const p = start + caret;
        doc.setSel(p, p);
      }
      this.view._invalidateFrom(doc.positionAt(start).line);
      this.view._afterExternalEdit();
      this.hide();
    }

    /**
     * 片段模板 → 纯文本。
     * 支持 ${1:默认值} 与 $0；$0 决定插入后光标的落点。
     */
    _snippetToText(tpl) {
      const text = tpl
        .replace(/\$\{\d+:([^}]*)\}/g, '$1')
        .replace(/\$\d+/g, '');
      let caret = -1;
      const idx = tpl.indexOf('$0');
      if (idx >= 0) {
        caret = tpl.slice(0, idx)
          .replace(/\$\{\d+:([^}]*)\}/g, '$1')
          .replace(/\$\d+/g, '')
          .length;
      }
      return { text, caret };
    }
  }

  NT.CompletionController = CompletionController;
  NT.completionProviders = { keywordProvider, documentWordProvider, snippetProvider, SNIPPETS };

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== src/60-search.js ==== */
/* ============================================================================
 * 60-search.js — 查找 / 替换引擎（纯逻辑，无 DOM，可单测）
 *
 * 关键设计：
 *  · 搜索按「逐行扫描」进行，而不是把整篇文档拼成一个大字符串。
 *    好处：内存恒定、天然拿到行/列、^ $ 语义符合行编辑器直觉；
 *    代价：模式无法跨行匹配。若用户显式使用 \n 或开启 multiLine，则自动
 *    切换到全文字符串路径（大文件下会给出告警）。
 *  · 所有查询走同一个 compile()，非法正则在编译期就被拦截并回传错误信息，
 *    避免在扫描过程中反复抛异常。
 *  · 零宽匹配（如 x*、\b）必须手动推进 lastIndex，否则 exec 会死循环。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});

  const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const DEFAULT_LIMIT = 200000;

  /**
   * 编译查询
   * @param {string} query
   * @param {object} opt {regex, caseSensitive, wholeWord, multiLine}
   * @returns {{re:RegExp|null, error:string|null, empty:boolean, source:string}}
   */
  function compile(query, opt) {
    opt = opt || {};
    if (query === '' || query === null || query === undefined) {
      return { re: null, error: null, empty: true, source: '' };
    }
    let src = opt.regex ? query : escapeRe(query);
    // 全词匹配用零宽断言实现，避免把边界字符吃掉导致匹配区间偏移
    if (opt.wholeWord) src = '(?<![\\w$])(?:' + src + ')(?![\\w$])';
    const flags = 'g' + (opt.caseSensitive ? '' : 'i');
    try {
      return { re: new RegExp(src, flags), error: null, empty: false, source: src };
    } catch (e) {
      return { re: null, error: e.message, empty: false, source: src };
    }
  }

  /**
   * 在文档中查找全部匹配。
   * @returns {Array<{start:number,end:number,line:number,col:number,match:string}>}
   */
  function findAll(doc, query, opt) {
    opt = opt || {};
    const c = compile(query, opt);
    if (c.empty || c.error) return [];

    const limit = opt.limit || DEFAULT_LIMIT;
    const res = [];
    const lines = doc.lines;

    // 跨行模式：退化为整串扫描（仅在小文件或用户显式要求时）
    if (opt.multiLine) {
      const text = doc.getText();
      c.re.lastIndex = 0;
      let m, guard = 0;
      while ((m = c.re.exec(text)) !== null && guard++ < limit) {
        const p = doc.positionAt(m.index);
        res.push({ start: m.index, end: m.index + m[0].length, line: p.line, col: p.col, match: m[0] });
        if (m[0].length === 0) c.re.lastIndex++;
      }
      return res;
    }

    let offset = 0;
    for (let li = 0, n = lines.length; li < n; li++) {
      const text = lines[li];
      c.re.lastIndex = 0;
      let m;
      while ((m = c.re.exec(text)) !== null) {
        res.push({
          start: offset + m.index, end: offset + m.index + m[0].length,
          line: li, col: m.index, match: m[0]
        });
        if (m[0].length === 0) c.re.lastIndex++;   // 零宽匹配保护
        if (res.length >= limit) return res;
      }
      offset += text.length + 1;                   // 行分隔符固定为 \n（1 字符）
    }
    return res;
  }

  /** 在纯文本中查找（供"在文件中查找"、宏回放校验等复用） */
  function findAllInText(text, query, opt) {
    const c = compile(query, opt);
    if (c.empty || c.error) return [];
    const res = [];
    const limit = (opt && opt.limit) || DEFAULT_LIMIT;
    let m;
    c.re.lastIndex = 0;
    while ((m = c.re.exec(text)) !== null && res.length < limit) {
      res.push({ start: m.index, end: m.index + m[0].length, match: m[0] });
      if (m[0].length === 0) c.re.lastIndex++;
    }
    return res;
  }

  /** 计数（大文件下限制上限即可，用于查找栏的 "N/M" 显示） */
  function count(doc, query, opt) {
    return findAll(doc, query, opt).length;
  }

  /** 从给定偏移向后找下一个匹配（循环查找，支持"回绕"） */
  function findNext(doc, query, opt, fromOffset, wrap) {
    const all = findAll(doc, query, opt);
    if (!all.length) return null;
    for (const m of all) if (m.start >= fromOffset) return m;
    return wrap ? all[0] : null;
  }
  function findPrev(doc, query, opt, fromOffset, wrap) {
    const all = findAll(doc, query, opt);
    if (!all.length) return null;
    for (let i = all.length - 1; i >= 0; i--) if (all[i].start < fromOffset) return all[i];
    return wrap ? all[all.length - 1] : null;
  }

  /**
   * 替换全部。所有编辑打包成一个事务，因此一次 Ctrl+Z 即可整体撤销。
   *
   * 两个必须注意的点：
   *
   * 1) **不能沿用 findAll 的默认上限**。DEFAULT_LIMIT 是为「查找栏展示匹配列表」
   *    设计的（避免大文件下把几百万个匹配对象全部驻留内存），但「全部替换」语义上
   *    就是"一处不漏"。沿用同一个上限会导致超过 20 万处的文档被静默少替换，
   *    返回值还谎报已完成。
   *
   * 2) **同一行内的多处匹配要合并成一次行内替换**。逐处调用 replaceRange 有两个
   *    性能陷阱：一是编辑次数 = 匹配数，二是当整篇文档是「一条超长行」（压缩后的
   *    js/css 就是如此）时，每次编辑都要重建这条巨大的字符串 —— V8 对 ConsString
   *    做 slice 会强制扁平化，于是退化成 O(N²)（实测 25 万处需 33 秒）。
   *    按行分组后，编辑次数降到 O(受影响行数)，超长行也只重建一次。
   *
   * @returns {number} 替换次数
   */
  function replaceAll(doc, query, replacement, opt) {
    opt = opt || {};
    const c = compile(query, opt);
    if (c.empty || c.error) return 0;
    const all = findAll(doc, query, {
      regex: opt.regex, caseSensitive: opt.caseSensitive,
      wholeWord: opt.wholeWord, multiLine: opt.multiLine,
      limit: opt.limit || Infinity
    });
    if (!all.length) return 0;

    const repOf = (m) => (opt.regex ? expandGroups(doc.getRange(m.start, m.end), replacement, c.re) : replacement);

    // multiLine 模式下单个匹配可以横跨多行，无法按行归并，退回逐处替换
    const edits = [];
    if (opt.multiLine) {
      for (const m of all) edits.push({ start: m.start, end: m.end, text: repOf(m) });
    } else {
      let i = 0;
      while (i < all.length) {
        const line = all[i].line;
        const lineText = doc.lines[line];
        let out = '', cursor = 0, j = i;
        while (j < all.length && all[j].line === line) {
          const m = all[j];
          out += lineText.slice(cursor, m.col) + repOf(m);
          cursor = m.col + (m.end - m.start);
          j++;
        }
        out += lineText.slice(cursor);
        edits.push({ start: doc.offsetAt(line, 0), end: doc.offsetAt(line, lineText.length), text: out });
        i = j;
      }
    }

    doc.beginBatch('替换全部');
    try {
      // 从后向前替换，避免前面的编辑让后面的偏移失效
      for (let k = edits.length - 1; k >= 0; k--) {
        doc.replaceRange(edits[k].start, edits[k].end, edits[k].text, { undo: 'other' });
      }
    } finally {
      doc.endBatch();
    }
    return all.length;
  }

  /** 展开 $1..$99 / $& / $0 反向引用 */
  function expandGroups(matched, replacement, re) {
    if (replacement.indexOf('$') < 0) return replacement;
    const single = new RegExp(re.source, re.flags.replace('g', ''));
    const mm = single.exec(matched);
    if (!mm) return replacement;
    return replacement.replace(/\$(\d{1,2}|&)/g, (whole, g) => {
      if (g === '&') return mm[0];
      const idx = parseInt(g, 10);
      return mm[idx] === undefined ? whole : mm[idx];
    });
  }

  /** 替换当前一处 */
  function replaceOne(doc, m, replacement, opt) {
    opt = opt || {};
    const c = compile(opt.query || '', opt);
    const rep = (opt.regex && c.re)
      ? expandGroups(doc.getRange(m.start, m.end), replacement, c.re)
      : replacement;
    doc.replaceRange(m.start, m.end, rep, {
      undo: 'other', sel: { anchor: m.start, head: m.start + rep.length }
    });
    return rep.length - (m.end - m.start);
  }

  NT.search = {
    compile, findAll, findAllInText, count, findNext, findPrev,
    replaceAll, replaceOne, escapeRe, DEFAULT_LIMIT
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== src/70-macro.js ==== */
/* ============================================================================
 * 70-macro.js — 宏录制与回放
 *
 * 设计原则：宏记录的是「语义化命令」而不是「按键」或「字符偏移」。
 *   · 记录按键：无法跨键盘布局/输入法，且回放时依赖焦点状态。
 *   · 记录字符偏移：文档一变就错位。
 *   · 记录语义命令（insertText / deleteBackward / replaceAll / gotoLine…）：
 *     回放时基于「当前光标位置」重新执行，鲁棒性最好，这也是 Notepad++ 的做法。
 *
 * 所有编辑类命令都必须走 app.exec() 才能被录到——这是本项目的一条硬约定，
 * 因此输入框里的每次按键都会先被还原成语义操作（见 onViewInput）。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});

  /** 回放时跳过这些命令，避免宏把"录制/回放"自身也录进去造成递归 */
  const NEVER_RECORD = new Set([
    'macro.record.start', 'macro.record.stop', 'macro.play', 'macro.playNamed',
    'file.new', 'file.open', 'file.save', 'file.saveAs', 'app.quit',
    'plugin.toggle', 'ui.palette', 'ui.theme'
  ]);

  class MacroEngine {
    constructor(app) {
      this.app = app;
      this.recording = false;
      this.playing = false;
      this.steps = [];               // 正在录制的步骤
      this.macros = new Map();       // name -> steps[]
      this.currentName = null;
      this._prevCaret = 0;
      this._abort = false;
      this._listeners = new Set();

      // 文本输入（含输入法、粘贴）统一还原成语义编辑操作
      NT.bus.on('view:input', (p) => this._onViewInput(p));
      NT.bus.on('view:selection', (p) => {
        const doc = this.app.activeDoc;
        if (doc && p.doc === doc) this._prevCaret = doc.sel.head;
      });
    }

    on(fn) { this._listeners.add(fn); return () => this._listeners.delete(fn); }
    _notify() { for (const f of this._listeners) f(this); }

    /* ------------------------------------------------------------ 录制 */
    start(name) {
      if (this.recording) return false;
      this.recording = true;
      this.steps = [];
      this.currentName = name || null;
      NT.bus.emit('macro:state', { recording: true, playing: false, steps: 0 });
      this._notify();
      return true;
    }

    stop() {
      if (!this.recording) return null;
      this.recording = false;
      const steps = this.steps;
      this.steps = [];
      let name = this.currentName;
      if (!name) name = '宏 ' + (this.macros.size + 1) + '（' + steps.length + ' 步）';
      this.macros.set(name, steps);
      this.currentName = null;
      NT.bus.emit('macro:state', { recording: false, playing: false, steps: steps.length });
      NT.bus.emit('macro:recorded', { name, steps: steps.length });
      this._notify();
      return { name, steps };
    }

    _record(id, args) {
      if (!this.recording || this.playing) return;
      if (NEVER_RECORD.has(id)) return;
      this.steps.push({ id, args: args ? JSON.parse(JSON.stringify(args)) : undefined });
      NT.bus.emit('macro:state', { recording: true, playing: false, steps: this.steps.length });
    }

    /** 把一次输入差分翻译成语义编辑操作 */
    _onViewInput(p) {
      if (!this.recording || this.playing) return;
      const ch = p.change;
      if (!ch) return;
      const removed = Math.max(0, ch.end - ch.start);
      if (removed === 0 && ch.text) {
        this._record('edit.insertText', { text: ch.text });
      } else if (removed > 0 && !ch.text) {
        // 方向：编辑前光标在区间尾部 → 退格；在头部 → 删除
        const dir = this._prevCaret >= ch.end ? 'back' : 'forward';
        this._record('edit.delete', { len: removed, dir });
      } else if (ch.text) {
        this._record('edit.replace', { len: removed, text: ch.text });
      }
      this._prevCaret = ch.start + (ch.text ? ch.text.length : 0);
    }

    /* ------------------------------------------------------------ 回放 */
    /**
     * @param {string} name 宏名
     * @param {object} opt {times, loop, delay, onStep}
     */
    async play(name, opt) {
      opt = opt || {};
      const steps = this.macros.get(name);
      if (!steps) return { ok: false, error: '宏不存在：' + name };
      if (this.playing) return { ok: false, error: '正在回放中' };

      const times = Math.max(1, opt.times || 1);
      const delay = opt.delay === undefined ? (this.app.settings.macroDelay || 0) : opt.delay;
      this.playing = true;
      this._abort = false;
      NT.bus.emit('macro:state', { recording: false, playing: true, steps: steps.length, name });
      this._notify();

      const doc = this.app.activeDoc;
      // 整段回放合并成一次撤销单元
      if (doc) doc.beginBatch('宏回放：' + name);
      let executed = 0;
      try {
        for (let round = 0; round < times && !this._abort; round++) {
          for (let i = 0; i < steps.length; i++) {
            if (this._abort) break;
            const st = steps[i];
            this.app.exec(st.id, st.args, { fromMacro: true });
            executed++;
            if (delay > 0) await new Promise((r) => setTimeout(r, delay));
            else if (i % 40 === 39) await NT.yieldToUI();
            if (opt.onStep) opt.onStep(i + 1, steps.length, round + 1, times);
          }
        }
      } catch (e) {
        console.error('[Macro] 回放异常', e);
        this.app.toast('宏回放出错：' + e.message, 'err');
      } finally {
        if (doc) doc.endBatch();
        this.playing = false;
        NT.bus.emit('macro:state', { recording: false, playing: false, steps: steps.length, name });
        this._notify();
      }
      return { ok: true, executed, times };
    }

    stopPlayback() { this._abort = true; }

    /* ------------------------------------------------------------ 管理 */
    list() {
      return Array.from(this.macros.entries()).map(([name, steps]) => ({ name, steps: steps.length }));
    }
    rename(oldName, newName) {
      if (!this.macros.has(oldName) || !newName) return false;
      const v = this.macros.get(oldName);
      this.macros.delete(oldName);
      this.macros.set(newName, v);
      this._notify();
      return true;
    }
    remove(name) { const r = this.macros.delete(name); this._notify(); return r; }
    get(name) { return this.macros.get(name) || null; }

    /** 导出为可读 JSON（便于分享/版本管理） */
    exportJson() {
      return JSON.stringify({
        format: 'notepad-two-macro',
        version: 1,
        macros: Array.from(this.macros.entries()).map(([name, steps]) => ({ name, steps }))
      }, null, 2);
    }
    importJson(text, mode) {
      let data;
      try { data = JSON.parse(text); }
      catch (e) { return { ok: false, error: 'JSON 解析失败：' + e.message }; }
      if (!data || !Array.isArray(data.macros)) return { ok: false, error: '缺少 macros 字段' };
      let n = 0;
      for (const m of data.macros) {
        if (!m || typeof m.name !== 'string' || !Array.isArray(m.steps)) continue;
        let name = m.name;
        if (mode !== 'overwrite' && this.macros.has(name)) name = name + ' (导入)';
        this.macros.set(name, m.steps);
        n++;
      }
      this._notify();
      return { ok: true, count: n };
    }
  }

  NT.MacroEngine = MacroEngine;
  NT.MacroEngine.NEVER_RECORD = NEVER_RECORD;

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== src/80-plugins.js ==== */
/* ============================================================================
 * 80-plugins.js — 插件宿主与内置插件
 *
 * 扩展点（Extension Points）——插件通过 ctx 注册，全部返回注销函数：
 *   addCommand            命令（可绑定快捷键、可出现在命令面板、可被宏录制）
 *   addMenuItem           菜单项
 *   addToolbarButton      工具栏按钮
 *   addStatusItem         状态栏条目
 *   addSidePanel          侧边栏面板
 *   addLanguage           新增/覆盖语言定义（高亮 + 补全自动生效）
 *   addCompletionProvider 补全数据源
 *   addDecorator          行内装饰（叠加在语法着色之上）
 *   addTextProcessor      「对选区/整篇文本做变换」的纯函数处理器
 *
 * 生命周期：register() 只登记元信息，activate() 才创建 ctx 并执行插件逻辑。
 * 停用时按注册的逆序执行所有 disposer，确保不留残留监听器/装饰器/命令。
 * ========================================================================== */
(function (global) {
  'use strict';
  const NT = global.NT || (global.NT = {});
  const U = NT.util;

  class PluginHost {
    constructor(app) {
      this.app = app;
      this.plugins = new Map();     // id -> {def, ctx, enabled}
      this._order = 0;
      NT.bus.on('*', () => { /* 预留：插件审计钩子 */ });
    }

    /* ------------------------------------------------------------ 注册 */
    register(def) {
      if (!def || !def.id) throw new Error('插件必须有 id');
      if (this.plugins.has(def.id)) return this.plugins.get(def.id);
      this.plugins.set(def.id, {
        def, ctx: null, enabled: false,
        meta: {
          id: def.id,
          name: def.name || def.id,
          version: def.version || '1.0.0',
          author: def.author || '未知',
          description: def.description || '',
          builtin: !!def.builtin,
          defaultEnabled: def.defaultEnabled !== false,
          order: this._order++
        }
      });
      return this.plugins.get(def.id);
    }

    /* ------------------------------------------------------------ 激活 */
    activate(id) {
      const p = this.plugins.get(id);
      if (!p || p.enabled) return false;
      const ctx = this._createContext(p);
      p.ctx = ctx;
      try {
        if (typeof p.def.activate === 'function') p.def.activate(ctx);
      } catch (e) {
        console.error('[Plugin] ' + id + ' 激活失败', e);
        this.app.toast('插件 ' + p.meta.name + ' 激活失败：' + e.message, 'err');
        ctx.dispose();
        p.ctx = null;
        return false;
      }
      p.enabled = true;
      NT.bus.emit('plugin:loaded', { id, name: p.meta.name });
      return true;
    }

    deactivate(id) {
      const p = this.plugins.get(id);
      if (!p || !p.enabled) return false;
      try {
        if (typeof p.def.deactivate === 'function') p.def.deactivate(p.ctx);
      } catch (e) { console.error('[Plugin] ' + id + ' 停用异常', e); }
      p.ctx.dispose();
      p.ctx = null;
      p.enabled = false;
      NT.bus.emit('plugin:unloaded', { id });
      return true;
    }

    toggle(id) { return this.isEnabled(id) ? (this.deactivate(id), false) : (this.activate(id), true); }
    isEnabled(id) { const p = this.plugins.get(id); return !!(p && p.enabled); }
    get(id) { return this.plugins.get(id) || null; }

    list() {
      return Array.from(this.plugins.values())
        .map((p) => Object.assign({}, p.meta, { enabled: p.enabled }))
        .sort((a, b) => (a.builtin === b.builtin ? a.order - b.order : a.builtin ? -1 : 1));
    }

    /** 按顺序激活所有 defaultEnabled 插件 */
    activateDefaults() {
      for (const p of this.plugins.values()) {
        if (p.meta.defaultEnabled) this.activate(p.meta.id);
      }
    }

    /* ------------------------------------------------------ 插件上下文 */
    _createContext(p) {
      const app = this.app;
      const disposers = [];
      const pluginId = p.meta.id;

      const own = (fn) => { disposers.push(fn); return fn; };
      const tagged = (id) => pluginId + '.' + id;

      const ctx = {
        id: pluginId,
        app,
        bus: NT.bus,
        version: NT.version,

        /** 命名空间隔离的持久化存储 */
        storage: {
          get(k, def) {
            try {
              const raw = localStorage.getItem('nt2.plugin.' + pluginId + '.' + k);
              return raw === null ? def : JSON.parse(raw);
            } catch (e) { return def; }
          },
          set(k, v) {
            try { localStorage.setItem('nt2.plugin.' + pluginId + '.' + k, JSON.stringify(v)); }
            catch (e) { /* 配额满等情况静默 */ }
          }
        },

        addCommand(spec) {
          if (!spec || !spec.id || typeof spec.run !== 'function') throw new Error('命令需要 id 与 run');
          const fullId = tagged(spec.id);
          app.commands.register(Object.assign({}, spec, {
            id: fullId, plugin: pluginId, title: spec.title || spec.id
          }));
          own(() => app.commands.unregister(fullId));
          return fullId;
        },

        addMenuItem(spec) {
          app.ui.addMenuItem(Object.assign({}, spec, { plugin: pluginId }));
          own(() => app.ui.removeMenuItem(spec.menu, spec.label));
        },

        addToolbarButton(spec) {
          app.ui.addToolbarButton(Object.assign({}, spec, { plugin: pluginId }));
          own(() => app.ui.removeToolbarButton(spec.id));
        },

        addStatusItem(spec) {
          app.ui.addStatusItem(Object.assign({}, spec, { plugin: pluginId }));
          own(() => app.ui.removeStatusItem(spec.id));
        },

        addSidePanel(spec) {
          app.ui.addSidePanel(Object.assign({}, spec, { plugin: pluginId }));
          own(() => app.ui.removeSidePanel(spec.id));
        },

        addLanguage(def) {
          NT.languages.def(def.id, def);
          own(() => { /* 语言定义常驻，卸载时不回滚，避免影响已打开的文档 */ });
        },

        addCompletionProvider(fn) {
          const off = app.view && app.view.ac ? app.view.ac.register(fn) : null;
          if (off) own(off);
        },

        addDecorator(fn) {
          const off = app.view.addDecorator(fn);
          own(off);
        },

        /** 文本处理器：出现在「文本处理」菜单与命令面板中 */
        addTextProcessor(spec) {
          app.textProcessors.push(Object.assign({ plugin: pluginId }, spec));
          own(() => {
            const i = app.textProcessors.findIndex((t) => t.id === spec.id && t.plugin === pluginId);
            if (i >= 0) app.textProcessors.splice(i, 1);
          });
        },

        getDocument() { return app.activeDoc; },
        getView() { return app.view; },
        getEditor() { return app.view; },
        notify(msg, type) { app.toast(msg, type); },

        /** 注册清理函数（插件也可主动调用） */
        onDispose: own,

        dispose() { for (let i = disposers.length - 1; i >= 0; i--) { try { disposers[i](); } catch (e) {} } }
      };
      return ctx;
    }

    /**
     * 从源码动态加载插件（演示扩展机制的"热插拔"能力）。
     * 源码需调用 define(pluginDef)。使用 new Function 求值 —— 与 VS Code / Notepad++
     * 的插件模型一样，加载即授予完全权限，因此界面上有明确的风险提示。
     */
    loadFromSource(code) {
      const collected = [];
      const define = (d) => { if (d && d.id) collected.push(d); };
      const fn = new Function('NT', 'define', 'window', '"use strict";\n' + code);
      fn(NT, define, window);
      if (!collected.length) throw new Error('源码中未调用 define(plugin)');
      const results = [];
      for (const d of collected) {
        this.register(Object.assign({}, d, { builtin: false }));
        results.push({ id: d.id, name: d.name || d.id });
      }
      return results;
    }

    unregister(id) {
      this.deactivate(id);
      this.plugins.delete(id);
    }
  }

  NT.PluginHost = PluginHost;

  /* ========================================================================
   *                          内置插件
   * ====================================================================== */

  /* ---------------------------------------------------- 1) 文档统计 */
  const wordCountPlugin = {
    id: 'builtin.wordcount',
    name: '文档统计',
    version: '1.0.0',
    author: '内置',
    description: '状态栏实时显示行数/字符数/词数，侧边栏给出详细统计与阅读时长估算。',
    builtin: true,
    activate(ctx) {
      ctx.addStatusItem({
        id: 'wc', align: 'right', order: 10,
        render(doc) {
          if (!doc) return '';
          const s = doc.stats();
          return `行 ${s.lines} · 字符 ${s.chars} · 词 ${s.words}`;
        }
      });
      ctx.addSidePanel({
        id: 'wc', title: '统计', order: 10,
        render(el, app) {
          const doc = app.activeDoc;
          if (!doc) { el.innerHTML = '<p style="color:var(--fg-dim)">无打开文档</p>'; return; }
          const s = doc.stats();
          const rows = [
            ['总行数', s.lines], ['非空行', s.nonEmpty], ['字符数（含空格）', s.chars],
            ['字符数（不含空格）', s.charsNoSpace], ['词数', s.words],
            ['UTF-8 字节', U.formatBytes(doc.byteSize)],
            ['预计阅读', Math.max(1, Math.round(s.words / 220)) + ' 分钟'],
            ['语言', NT.languages.get(doc.language).name],
            ['换行符', doc.eol === '\r\n' ? 'CRLF' : doc.eol === '\r' ? 'CR' : 'LF']
          ];
          el.innerHTML = '<h4>当前文档</h4>' + rows.map(([k, v]) =>
            '<div class="row"><span>' + U.esc(k) + '</span><b>' + U.esc(String(v)) + '</b></div>').join('');
        }
      });
    }
  };

  /* ---------------------------------------------------- 2) 括号匹配 */
  const BRACKET_LIMIT = 60000;
  function findBracketMatch(doc, offset) {
    const OPEN = '([{', CLOSE = ')]}';
    const ch = doc.getRange(offset, offset + 1);
    const oi = OPEN.indexOf(ch), ci = CLOSE.indexOf(ch);
    if (oi < 0 && ci < 0) return null;
    const forward = oi >= 0;
    const open = forward ? ch : OPEN[ci];
    const close = forward ? CLOSE[oi] : ch;
    const dir = forward ? 1 : -1;
    let depth = 0, steps = 0;
    for (let i = offset; i >= 0 && i < doc.length && steps < BRACKET_LIMIT; i += dir, steps++) {
      const c = doc.getRange(i, i + 1);
      if (c === open) depth++;
      else if (c === close) { depth--; if (depth === 0) return i; }
    }
    return null;
  }

  const bracketPlugin = {
    id: 'builtin.bracket',
    name: '括号配对高亮',
    version: '1.0.0',
    author: '内置',
    description: '光标位于括号旁时高亮与之配对的另一个括号，长函数体里定位非常有用。',
    builtin: true,
    activate(ctx) {
      ctx.addDecorator((docLine, lineText, view) => {
        const doc = view.doc;
        if (!doc || doc.sel.anchor !== doc.sel.head) return null;
        const pos = doc.positionAt(doc.sel.head);
        if (pos.line !== docLine) return null;

        const cands = [];
        if (pos.col < lineText.length) cands.push(pos.col);
        if (pos.col > 0) cands.push(pos.col - 1);
        for (const col of cands) {
          const ch = lineText[col];
          if (!ch || '([{)]}'.indexOf(ch) < 0) continue;
          const off = doc.offsetAt(docLine, col);
          const m = findBracketMatch(doc, off);
          if (m === null) continue;
          const mp = doc.positionAt(m);
          const out = [{ s: col, e: col + 1, cls: 'dec-bracket' }];
          if (mp.line === docLine) out.push({ s: mp.col, e: mp.col + 1, cls: 'dec-bracket' });
          return out;
        }
        return null;
      });
    }
  };

  /* ---------------------------------------------------- 3) 文本处理工具 */
  const textToolsPlugin = {
    id: 'builtin.texttools',
    name: '文本处理工具',
    version: '1.0.0',
    author: '内置',
    description: '排序/去重/去尾空格/大小写转换/行号/Base64/JSON 格式化，作用于选区或整篇文档。',
    builtin: true,
    activate(ctx) {
      const app = ctx.app;
      const T = (spec) => ctx.addTextProcessor(spec);

      T({
        id: 'sortAsc', title: '按行升序排序',
        run: (text) => text.split('\n').sort((a, b) => a.localeCompare(b, 'zh')).join('\n')
      });
      T({
        id: 'sortDesc', title: '按行降序排序',
        run: (text) => text.split('\n').sort((a, b) => b.localeCompare(a, 'zh')).join('\n')
      });
      T({
        id: 'sortNum', title: '按数值排序',
        run: (text) => text.split('\n').sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0)).join('\n')
      });
      T({
        id: 'dedupe', title: '删除重复行',
        run: (text) => {
          const seen = new Set();
          return text.split('\n').filter((l) => { if (seen.has(l)) return false; seen.add(l); return true; }).join('\n');
        }
      });
      T({
        id: 'dedupeKeepOrder', title: '删除重复行（保留首次出现）',
        run: (text) => {
          const seen = new Set();
          return text.split('\n').filter((l) => (seen.has(l) ? false : (seen.add(l), true))).join('\n');
        }
      });
      T({
        id: 'trimTrailing', title: '删除行尾空白',
        run: (text) => text.replace(/[ \t]+$/gm, '')
      });
      T({
        id: 'trimAll', title: '删除行首尾空白',
        run: (text) => text.split('\n').map((l) => l.trim()).join('\n')
      });
      T({
        id: 'removeEmpty', title: '删除空行',
        run: (text) => text.split('\n').filter((l) => l.trim() !== '').join('\n')
      });
      T({
        id: 'upper', title: '转为大写', run: (text) => text.toUpperCase()
      });
      T({
        id: 'lower', title: '转为小写', run: (text) => text.toLowerCase()
      });
      T({
        id: 'title', title: '转为标题格式',
        run: (text) => text.replace(/\b([a-zA-Z])([a-zA-Z]*)/g, (_, a, b) => a.toUpperCase() + b.toLowerCase())
      });
      T({
        id: 'snake', title: '转为 snake_case',
        run: (text) => text.replace(/([a-z0-9])([A-Z])/g, '$1_$2').replace(/[-\s]+/g, '_').toLowerCase()
      });
      T({
        id: 'camel', title: '转为 camelCase',
        run: (text) => text.replace(/[-_\s]+([a-zA-Z0-9])/g, (_, c) => c.toUpperCase())
          .replace(/^([A-Z])/, (_, c) => c.toLowerCase())
      });
      T({
        id: 'numberLines', title: '添加行号',
        run: (text) => text.split('\n').map((l, i) => String(i + 1).padStart(4, ' ') + '  ' + l).join('\n')
      });
      T({
        id: 'joinLines', title: '合并所有行',
        run: (text) => text.split('\n').map((l) => l.trim()).join(' ')
      });
      T({
        id: 'wrap80', title: '按 80 列折行',
        run: (text) => {
          const out = [];
          for (const para of text.split('\n')) {
            if (para.length <= 80) { out.push(para); continue; }
            let line = '';
            for (const w of para.split(/(\s+)/)) {
              if ((line + w).length > 80 && line.trim()) { out.push(line.replace(/\s+$/, '')); line = ''; }
              line += w;
            }
            if (line.trim()) out.push(line.replace(/\s+$/, ''));
          }
          return out.join('\n');
        }
      });
      T({
        id: 'base64enc', title: 'Base64 编码',
        run: (text) => {
          const bytes = new TextEncoder().encode(text);
          let bin = '';
          for (const b of bytes) bin += String.fromCharCode(b);
          return btoa(bin);
        }
      });
      T({
        id: 'base64dec', title: 'Base64 解码',
        run: (text) => {
          const bin = atob(text.trim());
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return new TextDecoder().decode(bytes);
        }
      });
      T({
        id: 'jsonFormat', title: 'JSON 格式化',
        run: (text) => {
          try { return JSON.stringify(JSON.parse(text), null, 2); }
          catch (e) { throw new Error('JSON 解析失败：' + e.message); }
        }
      });
      T({
        id: 'jsonMinify', title: 'JSON 压缩',
        run: (text) => {
          try { return JSON.stringify(JSON.parse(text)); }
          catch (e) { throw new Error('JSON 解析失败：' + e.message); }
        }
      });
      T({
        id: 'escapeHtml', title: 'HTML 转义',
        run: (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;')
      });
      T({
        id: 'unescapeHtml', title: 'HTML 反转义',
        run: (text) => text.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'").replace(/&amp;/g, '&')
      });
      T({
        id: 'tabToSpace', title: '制表符转空格',
        run: (text) => U.expandTabs(text, app.settings.tabSize || 4)
      });
      T({
        id: 'spaceToTab', title: '行首空格转制表符',
        run: (text) => {
          const size = app.settings.tabSize || 4;
          return text.split('\n').map((l) => {
            const m = /^( +)/.exec(l);
            if (!m) return l;
            const tabs = Math.floor(m[1].length / size);
            return '\t'.repeat(tabs) + ' '.repeat(m[1].length % size) + l.slice(m[1].length);
          }).join('\n');
        }
      });
    }
  };

  /* ---------------------------------------------------- 4) 时间戳 */
  const timestampPlugin = {
    id: 'builtin.timestamp',
    name: '插入时间戳',
    version: '1.0.0',
    author: '内置',
    description: '在当前光标处插入当前时间，支持自定义格式；已绑定快捷键 Ctrl+Alt+T。',
    builtin: true,
    activate(ctx) {
      const app = ctx.app;
      const fmt = (pattern) => {
        const d = new Date();
        const p2 = (n) => String(n).padStart(2, '0');
        const map = {
          'YYYY': d.getFullYear(), 'MM': p2(d.getMonth() + 1), 'DD': p2(d.getDate()),
          'HH': p2(d.getHours()), 'mm': p2(d.getMinutes()), 'ss': p2(d.getSeconds()),
          'ISO': d.toISOString()
        };
        return pattern.replace(/YYYY|MM|DD|HH|mm|ss|ISO/g, (m) => map[m]);
      };
      const cmdId = ctx.addCommand({
        id: 'insert',
        title: '插入时间戳',
        keybinding: 'Ctrl+Alt+T',
        run() {
          const pattern = ctx.storage.get('format', 'YYYY-MM-DD HH:mm:ss');
          app.view.insertText(fmt(pattern));
        }
      });
      ctx.addMenuItem({ menu: '编辑', label: '插入时间戳', command: cmdId, order: 90 });
      ctx.addTextProcessor({
        id: 'timestampPrefix',
        title: '每行加时间戳前缀',
        run: (text) => {
          const t = fmt('YYYY-MM-DD HH:mm:ss');
          return text.split('\n').map((l) => t + '  ' + l).join('\n');
        }
      });
      ctx.addSidePanel({
        id: 'ts', title: '时间戳', order: 30,
        render(el) {
          const cur = ctx.storage.get('format', 'YYYY-MM-DD HH:mm:ss');
          el.innerHTML =
            '<h4>时间戳格式</h4>' +
            '<p style="color:var(--fg-dim);line-height:1.6">支持占位符 YYYY / MM / DD / HH / mm / ss / ISO</p>' +
            '<input id="tsFmt" type="text" value="' + U.esc(cur) + '" ' +
            'style="width:100%;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg)">' +
            '<p style="margin:10px 0 6px">预览：<b>' + U.esc(fmt(cur)) + '</b></p>' +
            '<button class="mini-btn" id="tsSave">保存格式</button>';
          el.querySelector('#tsSave').addEventListener('click', () => {
            ctx.storage.set('format', el.querySelector('#tsFmt').value);
            app.toast('时间戳格式已保存', 'ok');
          });
        }
      });
    }
  };

  /* ---------------------------------------------------- 5) TODO 高亮 */
  const todoPlugin = {
    id: 'builtin.todo',
    name: 'TODO / FIXME 高亮',
    version: '1.0.0',
    author: '内置',
    description: '在注释中标记的 TODO、FIXME、HACK、XXX 会被醒目标出，并可在侧栏汇总。',
    builtin: true,
    activate(ctx) {
      const app = ctx.app;
      const RE = /\b(TODO|FIXME|HACK|XXX|NOTE|BUG)\b/g;
      const marks = [];
      const scan = (doc) => {
        marks.length = 0;
        if (!doc || doc.lines.length > 200000) return;
        for (let i = 0; i < doc.lines.length; i++) {
          const line = doc.lines[i];
          if (line.indexOf('TODO') < 0 && line.indexOf('FIXME') < 0 && line.indexOf('HACK') < 0 &&
              line.indexOf('XXX') < 0 && line.indexOf('NOTE') < 0 && line.indexOf('BUG') < 0) continue;
          RE.lastIndex = 0;
          let m;
          while ((m = RE.exec(line)) !== null) {
            marks.push({ line: i, col: m.index, len: m[0].length, tag: m[0], text: line.trim().slice(0, 120) });
          }
        }
      };
      const rebuild = U.debounce(() => { scan(ctx.getDocument()); app.refreshSidebar(); }, 400);
      NT.bus.on('doc:change', rebuild);
      NT.bus.on('doc:open', rebuild);
      scan(ctx.getDocument());

      ctx.addDecorator((docLine) => {
        const out = [];
        for (const m of marks) {
          if (m.line !== docLine) continue;
          out.push({ s: m.col, e: m.col + m.len, cls: 'dec-todo' });
        }
        return out.length ? out : null;
      });

      ctx.addSidePanel({
        id: 'todo', title: 'TODO', order: 20,
        render(el, app) {
          scan(app.activeDoc);
          if (!marks.length) { el.innerHTML = '<p style="color:var(--fg-dim)">未发现 TODO / FIXME 标记</p>'; return; }
          el.innerHTML = '<h4>共 ' + marks.length + ' 处</h4>' + marks.map((m, i) =>
            '<div class="row" data-line="' + m.line + '" style="cursor:pointer">' +
            '<span><b>' + U.esc(m.tag) + '</b> L' + (m.line + 1) + '</span>' +
            '<span style="color:var(--fg-dim);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
            U.esc(m.text) + '</span></div>').join('');
          el.querySelectorAll('[data-line]').forEach((n) => n.addEventListener('click', () => {
            const line = parseInt(n.dataset.line, 10);
            const doc = app.activeDoc;
            app.view.setCaret(doc.offsetAt(line, 0));
            app.view.scrollToLine(line, true);
          }));
        }
      });
    }
  };

  NT.builtinPlugins = [wordCountPlugin, bracketPlugin, textToolsPlugin, timestampPlugin, todoPlugin];

  if (typeof module !== 'undefined' && module.exports) module.exports = NT;
})(typeof window !== 'undefined' ? window : globalThis);
